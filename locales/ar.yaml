{meta: {code: ar,name: العربية,direction: rtl},messages: {UltiType header: UltiType,Typing practice and rating: تدريب الطباعة والتصنيف,ランクガイド: دليل التصنيفات,"ランクガイド（現在 {rank}）": "دليل التصنيفات (الحالي: {rank})",仮: تدريب,本: تصنيف,ユーザー: المستخدم,設定: الإعدادات,戻る: رجوع,settings: الإعدادات,theme: السمة,画面: الشاشة,テーマ: المظهر,表示テーマを切り替える: اختر مظهر الألوان.,入力画面と入力方式: شاشة الكتابة وطرق الإدخال,練習画面のモックを見ながら入力方式と表示を調整する: اضبط طرق الإدخال والعرض باستخدام معاينة شاشة التدريب.,開く: فتح,サウンド: الصوت,タイプ音とUI/結果音の音量、カテゴリ別のON/OFFを調整します。: اضبط مستوى أصوات الكتابة والواجهة والنتائج، وفعّل الفئات أو عطّلها.,音量: مستوى الصوت,タイプ音: أصوات الكتابة,UI/結果音: أصوات الواجهة والنتائج,自動リタイア: إنهاء الجلسة تلقائيًا,無入力リタイア: الإنهاء عند عدم النشاط,0 秒で無効: 0 للتعطيل,無入力リタイア秒数: مدة عدم النشاط قبل الإنهاء بالثواني,秒: ث,秒数を調整: تعديل الثواني,1秒増やす: زيادة ثانية واحدة,1秒減らす: تقليل ثانية واحدة,連続誤打鍵リタイア: الإنهاء بعد أخطاء متتالية,0 打鍵で無効: 0 للتعطيل,連続誤打鍵数: عدد الأخطاء المتتالية,打鍵: ضغطات,正誤率ボーダー: حد الدقة,0% で無効: 0٪ للتعطيل,その他の設定: إعدادات أخرى,次の課題の表示文字数: طول معاينة التمرين التالي,短文練習モードで次に出る課題文の冒頭を表示する。0文字で非表示: اعرض بداية التمرين التالي في التدريب القصير. أدخل 0 لإخفائها.,文字: أحرف,次の課題の表示文字数を調整: ضبط طول معاينة التمرين التالي,次の課題の表示文字数を増やす: زيادة طول المعاينة,次の課題の表示文字数を減らす: تقليل طول المعاينة,危険な操作: إجراءات حذف البيانات,データと設定を消去: مسح البيانات والإعدادات,ユーザーデータだけの削除、設定だけの初期化、またはその両方を選ぶ: اختر مسح بيانات المستخدم أو إعادة ضبط الإعدادات أو كليهما.,ユーザーデータ: بيانات المستخدم,設定を初期化: إعادة ضبط الإعدادات,両方: كلاهما,スコアと履歴だけを削除します。設定は残します。よろしいですか？: هل تريد حذف النتائج والسجل مع الإبقاء على الإعدادات؟,設定をすべて初期値に戻します。スコアと履歴は残します。よろしいですか？: هل تريد إعادة ضبط الإعدادات مع الإبقاء على النتائج والسجل؟,スコア、履歴、設定をすべて削除します。よろしいですか？: هل تريد حذف جميع النتائج والسجل والإعدادات؟,アプリの表示言語: لغة التطبيق,画面に表示する言語を選択します。練習する言語はモード選択画面で変更できます。: اختر لغة الواجهة. يمكنك تغيير لغة التدريب من شاشة اختيار الوضع.,日本語: اليابانية,English: الإنجليزية,ダーク: داكن,ライト: فاتح,この画面幅はサポート対象外です: عرض الشاشة هذا غير مدعوم,UltiType は 520px 以上のデスクトップ画面向けです。現在の表示ではデスクトップ向けレイアウトを維持します。: صُمّم UltiType لشاشات الكمبيوتر بعرض لا يقل عن 520 بكسل. سيظل تخطيط الكمبيوتر مستخدمًا هنا.,以後表示しない: عدم العرض مرة أخرى,警告を閉じる: إغلاق التنبيه,ランク到達状況: تقدم التصنيف,スコア計算式: معادلة احتساب النقاط,基本のスコア計算式: المعادلة الأساسية للنقاط,打鍵/秒 × 1000 × 正確率^モード係数 × 補正: ضغطات في الثانية × 1000 × الدقة^معامل الوضع × المضاعف,正確率は正しく入力した文字数 ÷ 入力を試みた文字数です。均等モードのみ、打鍵間隔の安定度が補正として加わります。: الدقة هي عدد الأحرف الصحيحة مقسومًا على عدد محاولات الإدخال. يضرب وضع التدفق النقاط في ثبات إيقاع الكتابة فقط.,正確率係数: معامل الدقة,補正: المضاعف,安定度: الثبات,なし: بلا,現在ランク: التصنيف الحالي,最高スコア: أفضل نتيجة,次の目標: الهدف التالي,ランク帯: المستوى,基準スコア: النتيجة المطلوبة,到達状況: الحالة,達成: تم بلوغه,"あと {score}": "متبقٍ {score}",ランクなし: بلا تصنيف,"{title} ランク": "مستويات {title}",灰: رمادي,薄緑: أخضر فاتح,薄青: أزرق فاتح,緑: أخضر,青: أزرق,橙: برتقالي,赤: أحمر,金: ذهبي,紫: بنفسجي,黒紫: أرجواني داكن,黒: أسود,虹: قوس قزح,ローカルユーザー: مستخدم محلي,Keybase連携は未設定です。: لم يتم إعداد ربط Keybase.,ユーザー概要: ملخص المستخدم,仮ランク: التصنيف التجريبي,本番ランク: التصنيف الرسمي,まだ保存されたセッションはありません。: لا توجد جلسات محفوظة بعد.,Recent Sessions: الجلسات الأخيرة,ランク: الرتبة,500点未満はランクなし、500点から G0 が始まり、基準スコアはランクごとに90点ずつ上がります。: النتائج الأقل من 500 بلا رتبة. تبدأ G0 عند 500، وتزداد النتيجة المطلوبة لكل رتبة بمقدار 90.,入力待ち: بانتظار الإدخال,課題終了まで非表示: مخفي حتى انتهاء النص,正誤率: الدقة,"ミス {count}": "الأخطاء: {count}",正誤履歴: سجل الإجابات الصحيحة والخاطئة,平均打鍵間隔: متوسط الفاصل بين ضغطات المفاتيح,ズレ平均: متوسط الانحراف,物理打鍵: ضغطات المفاتيح الفعلية,打鍵間隔の安定度グラフ: مخطط ثبات إيقاع الكتابة,"あと {count} 回": "متبقٍ {count}",残り時間: الوقت المتبقي,残り時間（％）: الوقت المتبقي (%),打鍵/秒: ضغطة/ثانية,打鍵/分: ضغطة/دقيقة,かな文字/秒: حرف كانا/ثانية,課題文字/秒: حرف من النص/ثانية,正確率: الدقة,ミス数: عدد الأخطاء,完了課題: المهام المكتملة,ミス/物理打鍵: الأخطاء/ضغطات المفاتيح الفعلية,正解/物理打鍵: الإجابات الصحيحة/ضغطات المفاتيح الفعلية,開始: ابدأ,修正: تصحيح,正打: صحيح,ミス: خطأ,モード選択: اختر الوضع,リセット: إعادة ضبط,無入力が続いたためリタイアしました: انتهت الجلسة بسبب عدم الإدخال لفترة طويلة,"セッション終了: {rank} / {score}": "انتهت الجلسة: {rank} / {score}",開始ボタン、またはここで入力を始める: اضغط «ابدأ» أو ابدأ الكتابة هنا,IMEありで入力し、行が一致したら Enter: اكتب باستخدام IME واضغط Enter عند تطابق السطر,英文を入力し、行が一致したら Enter: اكتب السطر الإنجليزي واضغط Enter عند تطابقه,typing input: حقل الكتابة,direct keyboard capture: التقاط مباشر لإدخال لوحة المفاتيح,resize typing input: تغيير حجم حقل الكتابة,Rank hidden for the first 30 seconds: تُخفى الرتبة خلال أول 30 ثانية,タイピング: الكتابة,速度だけじゃない。精度と安定性まで、次の一打へ。: الأمر لا يقتصر على السرعة. الدقة والثبات مع كل ضغطة تالية.,速さだけじゃない。精度と安定性まで、次の一打へ。: ليس الأمر سرعة فحسب. الدقة والثبات مع كل ضغطة تالية.,Tips: نصائح,typing practice: التدرب على الكتابة,Live Analysis: تحليل مباشر,"{key} / {interval} / {state}": "{key} / {interval} / {state}",画像を準備できませんでした。もう一度お試しください。: تعذّر تجهيز الصورة. يُرجى المحاولة مجددًا.,共有メニューにリザルト画像を送りました。: أُرسلت صورة النتيجة إلى قائمة المشاركة.,共有を完了できませんでした。画像保存をお試しください。: تعذرت المشاركة. جرّب حفظ الصورة.,Share APIが使えないため、画像を保存して投稿文をコピーしました。: واجهة المشاركة غير متاحة، لذا حُفظت الصورة ونُسخ نص المنشور.,"{service}を開きます。画像はPNG保存から添付してください。": "جارٍ فتح {service}. احفظ صورة PNG وأرفقها بمنشورك.","{service}を開きました。投稿画面にリザルト画像を貼り付けてください。": "تم فتح {service}. أدرج صورة النتيجة في منشورك.","{service}を開き、リザルト画像を保存しました。投稿画面で添付してください。": "تم فتح {service} وحُفظت صورة النتيجة. أرفقها من شاشة إنشاء المنشور.",投稿テンプレートをコピーしました。: تم نسخ قالب المنشور.,投稿テンプレートをコピーできませんでした。: تعذّر نسخ قالب المنشور.,SNS用リザルト画像: صورة النتيجة للنشر على وسائل التواصل الاجتماعي,"{mode}のリザルト画像。ランク{rank}、{score}ポイント": "صورة نتيجة {mode}: الرتبة {rank}، {score} نقطة",文言をコピー: نسخ النص,各SNSの投稿画面にはテンプレート文を入力済みです。画像は貼り付け、未対応ブラウザでは保存して添付できます。: قالب المنشور جاهز في شاشة النشر لكل شبكة اجتماعية. أدرج الصورة، أو احفظها وأرفقها إذا كان المتصفح لا يدعم المشاركة.,pre-session tip: نصيحة قبل الجلسة,post-session tip: نصيحة بعد الجلسة,本番モードは開始後の入力だけを採点します。: تُحتسب في الجلسات الرسمية الكتابة التي تبدأ بعد بدء الجلسة فقط.,本番モードは仮レーティング A0 以上で解放されます。: تُفتح الأوضاع الرسمية عند بلوغ التصنيف التجريبي A0 أو أعلى.,IMEあり本番では行