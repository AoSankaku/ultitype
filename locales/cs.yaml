{meta: {code: cs,name: Čeština,direction: ltr},messages: {UltiType header: UltiType,Typing practice and rating: Trénink psaní a hodnocení,ランクガイド: Průvodce hodnocením,"ランクガイド（現在 {rank}）": "Průvodce hodnocením (aktuálně: {rank})",仮: Trénink,本: Hodnocení,ユーザー: Uživatel,設定: Nastavení,戻る: Zpět,settings: nastavení,theme: téma,画面: Obrazovka,テーマ: Vzhled,表示テーマを切り替える: Vyberte barevný vzhled.,入力画面と入力方式: Obrazovka psaní a metody zadávání,練習画面のモックを見ながら入力方式と表示を調整する: Upravte metody zadávání a zobrazení pomocí náhledu tréninkové obrazovky.,開く: Otevřít,サウンド: Zvuk,タイプ音とUI/結果音の音量、カテゴリ別のON/OFFを調整します。: Upravte hlasitost zvuků psaní a rozhraní a zapínejte či vypínejte jednotlivé kategorie.,音量: Hlasitost,タイプ音: Zvuky psaní,UI/結果音: Zvuky rozhraní a výsledků,自動リタイア: Automatické ukončení relace,無入力リタイア: Ukončit při nečinnosti,0 秒で無効: Vypnete nastavením 0,無入力リタイア秒数: Doba nečinnosti do ukončení v sekundách,秒: s,秒数を調整: Upravit sekundy,1秒増やす: Přidat 1 sekundu,1秒減らす: Odebrat 1 sekundu,連続誤打鍵リタイア: Ukončit po opakovaných chybách,0 打鍵で無効: Vypnete nastavením 0,連続誤打鍵数: Počet chyb za sebou,打鍵: stisků,正誤率ボーダー: Hranice přesnosti,0% で無効: Vypnete nastavením 0 %,その他の設定: Další nastavení,次の課題の表示文字数: Délka náhledu dalšího úkolu,短文練習モードで次に出る課題文の冒頭を表示する。0文字で非表示: Zobrazit začátek dalšího textu při krátkém tréninku. Skrytí nastavíte na 0.,文字: znaků,次の課題の表示文字数を調整: Upravit délku náhledu,次の課題の表示文字数を増やす: Zvětšit délku náhledu,次の課題の表示文字数を減らす: Zmenšit délku náhledu,危険な操作: Mazání dat,データと設定を消去: Smazat data a nastavení,ユーザーデータだけの削除、設定だけの初期化、またはその両方を選ぶ: "Vyberte, zda smazat uživatelská data, obnovit nastavení, nebo provést obojí.",ユーザーデータ: Uživatelská data,設定を初期化: Obnovit nastavení,両方: Obojí,スコアと履歴だけを削除します。設定は残します。よろしいですか？: Smazat výsledky a historii a ponechat nastavení?,設定をすべて初期値に戻します。スコアと履歴は残します。よろしいですか？: Obnovit všechna nastavení a ponechat výsledky a historii?,スコア、履歴、設定をすべて削除します。よろしいですか？: "Smazat všechny výsledky, historii a nastavení?",アプリの表示言語: Jazyk aplikace,画面に表示する言語を選択します。練習する言語はモード選択画面で変更できます。: Vyberte jazyk rozhraní. Jazyk tréninku můžete změnit na obrazovce výběru režimu.,日本語: Japonština,English: Angličtina,ダーク: Tmavý,ライト: Světlý,この画面幅はサポート対象外です: Tato šířka obrazovky není podporována,UltiType は 520px 以上のデスクトップ画面向けです。現在の表示ではデスクトップ向けレイアウトを維持します。: UltiType je určen pro stolní obrazovky široké alespoň 520 px. Zobrazeno je rozložení pro počítač.,以後表示しない: Příště nezobrazovat,警告を閉じる: Zavřít upozornění,ランク到達状況: Postup hodnocením,スコア計算式: Vzorec výpočtu skóre,基本のスコア計算式: Základní vzorec skóre,打鍵/秒 × 1000 × 正確率^モード係数 × 補正: Údery za sekundu × 1000 × přesnost^koeficient režimu × násobitel,正確率は正しく入力した文字数 ÷ 入力を試みた文字数です。均等モードのみ、打鍵間隔の安定度が補正として加わります。: Přesnost je počet správně zadaných znaků dělený počtem pokusů. Stabilitou rytmu násobí skóre pouze režim Plynulost.,正確率係数: Koeficient přesnosti,補正: Násobitel,安定度: Stabilita,なし: Žádná,現在ランク: Aktuální hodnocení,最高スコア: Nejlepší skóre,次の目標: Další cíl,ランク帯: Úroveň,基準スコア: Požadované skóre,到達状況: Stav,達成: Dosaženo,"あと {score}": "Zbývá {score}",ランクなし: Bez hodnocení,"{title} ランク": "Úrovně: {title}",灰: Šedá,薄緑: Světle zelená,薄青: Světle modrá,緑: Zelená,青: Modrá,橙: Oranžová,赤: Červená,金: Zlatá,紫: Fialová,黒紫: Tmavě fialová,黒: Černá,虹: Duha,ローカルユーザー: Místní uživatel,Keybase連携は未設定です。: Propojení s Keybase není nastaveno.,ユーザー概要: Přehled uživatele,仮ランク: Cvičná úroveň,本番ランク: Oficiální úroveň,まだ保存されたセッションはありません。: Zatím nejsou uloženy žádné relace.,Recent Sessions: Nedávné relace,ランク: Úroveň,500点未満はランクなし、500点から G0 が始まり、基準スコアはランクごとに90点ずつ上がります。: Pod 500 body není žádná úroveň. G0 začíná na 500 bodech a hranice každé další úrovně se zvyšuje o 90 bodů.,入力待ち: Čeká se na vstup,課題終了まで非表示: Skryto do konce zadání,正誤率: Přesnost,"ミス {count}": "Chyby: {count}",正誤履歴: Historie správných a chybných odpovědí,平均打鍵間隔: Průměrný interval mezi stisky,ズレ平均: Průměrná odchylka,物理打鍵: Fyzické stisky kláves,打鍵間隔の安定度グラフ: Graf stability rytmu psaní,"あと {count} 回": "Zbývá {count}",残り時間: Zbývající čas,残り時間（％）: Zbývající čas (%),打鍵/秒: Stisky/s,打鍵/分: Stisky/min,かな文字/秒: Znaky kana/s,課題文字/秒: Znaky zadání/s,正確率: Přesnost,ミス数: Počet chyb,完了課題: Dokončená zadání,ミス/物理打鍵: Chyby/fyzické stisky kláves,正解/物理打鍵: Správné odpovědi/fyzické stisky kláves,開始: Spustit,修正: Oprava,正打: Správně,ミス: Chyba,モード選択: Vybrat režim,リセット: Resetovat,無入力が続いたためリタイアしました: Relace byla ukončena kvůli dlouhé nečinnosti,"セッション終了: {rank} / {score}": "Relace ukončena: {rank} / {score}",開始ボタン、またはここで入力を始める: Stiskněte Spustit nebo zde začněte psát,IMEありで入力し、行が一致したら Enter: Pište pomocí IME a po shodě řádku stiskněte Enter,英文を入力し、行が一致したら Enter: Napište anglický řádek a po jeho shodě stiskněte Enter,typing input: Pole pro psaní,direct keyboard capture: Přímé zachytávání vstupu z klávesnice,resize typing input: Změnit velikost pole pro psaní,Rank hidden for the first 30 seconds: Úroveň je prvních 30 sekund skrytá,タイピング: Psaní,速度だけじゃない。精度と安定性まで、次の一打へ。: Nejde jen o rychlost. Každý další stisk přináší přesnost a stabilitu.,速さだけじゃない。精度と安定性まで、次の一打へ。: Nejen rychlost. Přesnost a stabilita při každém dalším stisku.,Tips: Tipy,typing practice: Procvičování psaní,Live Analysis: Živá analýza,"{key} / {interval} / {state}": "{key} / {interval} / {state}",画像を準備できませんでした。もう一度お試しください。: Obrázek se nepodařilo připravit. Zkuste to znovu.,共有メニューにリザルト画像を送りました。: Obrázek výsledku byl odeslán do nabídky sdílení.,共有を完了できませんでした。画像保存をお試しください。: Sdílení se nezdařilo. Zkuste obrázek uložit.,Share APIが使えないため、画像を保存して投稿文をコピーしました。: "Rozhraní pro sdílení není dostupné, obrázek se uložil a text příspěvku zkopíroval.","{service}を開きます。画像はPNG保存から添付してください。": "Otevírá se {service}. Uložte PNG a přiložte jej k příspěvku.","{service}を開きました。投稿画面にリザルト画像を貼り付けてください。": "{service} je otevřen. Vložte obrázek výsledku do příspěvku.","{service}を開き、リザルト画像を保存しました。投稿画面で添付してください。": "Byl otevřen {service} a obrázek výsledku byl uložen. Přiložte ho na obrazovce příspěvku.",投稿テンプレートをコピーしました。: Šablona příspěvku byla zkopírována.,投稿テンプレートをコピーできませんでした。: Šablonu příspěvku se nepodařilo zkopírovat.,SNS用リザルト画像: Obrázek výsledku pro sociální sítě,"{mode}のリザルト画像。ランク{rank}、{score}ポイント": "Obrázek výsledku ({mode}): úroveň {rank}, {score} bodů",文言をコピー: Kopírovat text,各SNSの投稿画面にはテンプレート文を入力済みです。画像は貼り付け、未対応ブラウザでは保存して添付できます。: "Šablona příspěvku je připravena ve formuláři každé sociální sítě. Vložte obrázek, nebo jej v nepodporovaném prohlížeči uložte a přiložte.",pre-session tip: Tip před relací,post-session tip: Tip po relaci,本番モードは開始後の入力だけを採点します。: V oficiálním režimu se hodnotí pouze psaní zahájené po spuštění.,本番モードは仮レーティング A0 以上で解放されます。: Oficiální režimy se odemknou při cvičné úrovni A0 nebo vyšší.,IMEあり本番では行を課題と一致させてから Enter で提出します。: V oficiálním režimu s IME nejprve slaďte řádek se zadáním a odešlete jej klávesou Enter.,500点未満は NR、500点以上は G0、以降は90点ごとにランクが上がります。: "Pod 500 body je NR, od 500 bodů G0 a úroveň se zvyšuje každých 90 bodů.",練習モードの仮レーティングは、本番モード解放の条件として使われます。: "Cvičná úroveň určuje, kdy se odemknou oficiální režimy.",次の課題プレビューは設定画面で表示方式と長さを変更できます。: Způsob zobrazení náhledu dalšího zadání a jeho délku můžete změnit v nastavení.,正確無比とIMEあり本番では、ミスをBackspaceで戻すまで先に進めません。: "V režimu Přesnost a oficiálním režimu s IME nelze pokračovat, dokud chybu neopravíte klávesou Backspace.",自動リタイアは、設定から有効にできます。: Automatické ukončení můžete zapnout v nastavení.,自分の「つまづきパターン」を理解するのが、成長に不可欠です。: K pokroku je důležité porozumět vlastním vzorcům chyb.,たいてい、他人より自分自身と競争するほうが良い結果が出ます。: "Často dosáhnete lepších výsledků, když budete soutěžit sami se sebou, ne s ostatními.",楽だからといって「エンジニア座り」をしていると、腰を壊すので気をつけましょう。: "Pohodlný shrbený posed může poškodit záda, proto si hlídejte držení těla.",最高のパフォーマンスを出したいときは、まず机から離れ、爪の長さを確認するといいかも。: "Chcete-li podat nejlepší výkon, nejprve odejděte od stolu a zkontrolujte délku nehtů.",肩と手首の力を抜き、キーを押す力を必要最小限にすると次の入力が軽くなります。: Uvolněte ramena a zápěstí a tiskněte klávesy jen potřebnou silou; další psaní pak půjde snadněji.,焦るより、遅くても正確にやるほうがすべてのモードでスコアが伸びます。: "Přesnost zlepšuje skóre ve všech režimech, i když píšete pomaleji.",1日に長時間練習しすぎないようにしましょう。腱鞘炎になります。: "Netrénujte příliš dlouho během jednoho dne, ať nepřetěžujete šlachy.",英文はだいぶ日本語文と感覚が違います。分けて練習しましょう。: Psaní v angličtině se od japonštiny značně liší. Procvičujte je zvlášť.,一瞬一瞬のブーストよりも、安定してスラスラ打てるほうがスコアが伸びます。: Pravidelný plynulý rytmus zlepší skóre více než občasné zrychlení.,単語で反射神経を競わず、長文で実力を磨くのがオススメ。: Rozvíjejte své dovednosti na delších textech místo závodění v psaní jednotlivých slov.,文字をうったら、すぐにホームポジションに戻しましょう。: Po napsání každého znaku vraťte prsty na základní řadu kláves.,打鍵中、手元を絶対に見てはいけません。絶対です。: Při psaní se nikdy nedívejte na ruce. Opravdu nikdy.,できるだけ、毎日練習しましょう。それが最短ルートです。: "Procvičujte se každý den, když můžete. Je to nejrychlejší cesta ke zlepšení.",ずっと練習をするより、実用もするほうが伸びやすくなります。: "Rychleji se zlepšíte, když budete trénink kombinovat s praktickým psaním.",ミスしたキー単体よりも、ミスした組み合わせを見つける方が役に立つかも。: "Užitečnější může být najít kombinace kláves, ve kterých chybujete, než se soustředit na jedinou klávesu.",常に先読みを意識してみよう。: Při psaní se snažte průběžně číst dopředu.,高速化とは、文字を速く打つことではなく、迷う時間を減らすこと。: "Rychlejší psaní nespočívá v rychlejším pohybu prstů, ale v kratším váhání.",「ci」や「le」など、早く打てる別ルートも無理のない範囲で試してみよう。: "Pokud vám vyhovují, zkuste alternativní rychlé zápisy jako „ci“ nebo „le“.",入力画面設定: Nastavení obrazovky pro psaní,画面設定: Nastavení obrazovky,入力画面のプレビュー: Náhled obrazovky pro psaní,一時停止: Pozastavit,10.0打鍵/秒プレビュー: "Náhled: 10,0 stisku/s",5.0打鍵/秒プレビュー: "Náhled: 5,0 stisku/s",プレビューの課題文: Náhled zadání,短文: Krátký text,長文: Dlouhý text,入力画面: Obrazovka pro psaní,フォント: Písma,表示順: Pořadí zobrazení,漢字・ふりがな・ひらがな表示に使うGoogle Fonts: "Google Fonts používané pro zobrazení kandži, furigany a hiragany",日本語フォント: Japonské písmo,ローマ字・英語課題文に使うGoogle Fonts: Google Fonts používané pro romadži a anglická zadání,英語フォント: Anglické písmo,入力画面の表示順: Pořadí prvků na obrazovce pro psaní,ドラッグで入力画面の行順を変更する。非表示中の項目も順序を保持する: Přetažením změňte pořadí řádků na obrazovce. Skryté položky si své místo zachovají.,表示中: Viditelné,非表示中: Skryté,上部表示情報: Informace nahoře,表示する情報: Zobrazované informace,残り時間を外しても、残り時間バーは表示されます。: "Pruh zbývajícího času zůstane viditelný