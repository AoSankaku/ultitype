  各SNSの投稿画面にはテンプレート文を入力済みです。画像は貼り付け、未対応ブラウザでは保存して添付できます。: Die Beitragsvorlage ist in den Veröffentlichungsfenstern der Netzwerke bereits eingetragen. Bild einfügen oder bei nicht unterstützten Browsern speichern und anhängen.
  pre-session tip: Tipp vor der Sitzung
  post-session tip: Tipp nach der Sitzung
  本番モードは開始後の入力だけを採点します。: Im Wertungsmodus zählen nur Eingaben nach dem Start.
  本番モードは仮レーティング A0 以上で解放されます。: Der Wertungsmodus wird ab dem vorläufigen Rang A0 freigeschaltet.
  IMEあり本番では行を課題と一致させてから Enter で提出します。: Im IME-Wertungsmodus die Zeile an den Text anpassen und mit Enter absenden.
  500点未満は NR、500点以上は G0、以降は90点ごとにランクが上がります。: "Unter 500 Punkten: kein Rang; G0 beginnt bei 500. Danach steigt der Rang alle 90 Punkte."
  練習モードの仮レーティングは、本番モード解放の条件として使われます。: Der vorläufige Übungsrang schaltet den Wertungsmodus frei.
  次の課題プレビューは設定画面で表示方式と長さを変更できます。: Vorschauart und Länge des nächsten Textes in den Einstellungen ändern.
  正確無比とIMEあり本番では、ミスをBackspaceで戻すまで先に進めません。: In Präzision und IME-Wertung Fehler mit Backspace korrigieren, bevor es weitergeht.
  自動リタイアは、設定から有効にできます。: Den automatischen Abbruch in den Einstellungen aktivieren.
  自分の「つまづきパターン」を理解するのが、成長に不可欠です。: Die eigenen Fehlermuster zu verstehen, ist wichtig für den Fortschritt.
  たいてい、他人より自分自身と競争するほうが良い結果が出ます。: Meistens bringt es bessere Ergebnisse, sich mit sich selbst statt mit anderen zu messen.
  楽だからといって「エンジニア座り」をしていると、腰を壊すので気をつけましょう。: Eine bequeme, aber gekrümmte Sitzhaltung kann dem Rücken schaden.
  最高のパフォーマンスを出したいときは、まず机から離れ、爪の長さを確認するといいかも。: Für beste Leistung kurz vom Schreibtisch wegtreten und die Fingernägel prüfen.
  肩と手首の力を抜き、キーを押す力を必要最小限にすると次の入力が軽くなります。: Schultern und Handgelenke entspannen. Tasten nur so fest wie nötig drücken.
  焦るより、遅くても正確にやるほうがすべてのモードでスコアが伸びます。: In jedem Modus verbessert Genauigkeit die Punktzahl mehr als schnelles Tippen mit Fehlern.
  1日に長時間練習しすぎないようにしましょう。腱鞘炎になります。: Nicht zu lange am Stück üben, um Sehnenreizungen zu vermeiden.
  英文はだいぶ日本語文と感覚が違います。分けて練習しましょう。: Englisch und Japanisch tippen sich sehr unterschiedlich. Übe beide Sprachen getrennt.
  一瞬一瞬のブーストよりも、安定してスラスラ打てるほうがスコアが伸びます。: Ein gleichmäßiger Rhythmus bringt mehr als kurze Geschwindigkeitsschübe.
  単語で反射神経を競わず、長文で実力を磨くのがオススメ。: Mit langen Texten Fähigkeiten aufbauen statt einzelne Wörter als Reaktionstest tippen.
  文字をうったら、すぐにホームポジションに戻しましょう。: Nach jedem Anschlag die Finger zur Grundstellung zurückführen.
  打鍵中、手元を絶対に見てはいけません。絶対です。: Beim Tippen nicht auf die Hände schauen. Wirklich nicht.
  できるだけ、毎日練習しましょう。それが最短ルートです。: Wenn möglich täglich üben. Das ist der schnellste Weg zum Fortschritt.
  ずっと練習をするより、実用もするほうが伸びやすくなります。: Übung und alltägliches Schreiben abwechseln, um leichter Fortschritte zu machen.
  ミスしたキー単体よりも、ミスした組み合わせを見つける方が役に立つかも。: Es kann hilfreicher sein, fehleranfällige Tastenkombinationen zu finden als einzelne Tasten zu untersuchen.
  常に先読みを意識してみよう。: Beim Tippen versuchen, einige Wörter vorauszulesen.
  高速化とは、文字を速く打つことではなく、迷う時間を減らすこと。: Schneller werden heißt weniger zögern, nicht nur die Finger schneller zu bewegen.
  「ci」や「le」など、早く打てる別ルートも無理のない範囲で試してみよう。: Wenn es sich gut anfühlt, alternative Eingabefolgen wie „ci“ oder „le“ ausprobieren.
