  各SNSの投稿画面にはテンプレート文を入力済みです。画像は貼り付け、未対応ブラウザでは保存して添付できます。: The post template is
    ready in each social app. Paste the image, or save and attach it in browsers
    that do not support image sharing.
  pre-session tip: Pre-session tip
  post-session tip: Post-session tip
  本番モードは開始後の入力だけを採点します。: Rated sessions score only the input you enter after starting.
  本番モードは仮レーティング A0 以上で解放されます。: Rating modes unlock at a practice rating of A0 or higher.
  IMEあり本番では行を課題と一致させてから Enter で提出します。: In rated mode with IME, match the prompt line and press Enter to submit it.
  500点未満は NR、500点以上は G0、以降は90点ごとにランクが上がります。: Scores below 500 are NR. G0 starts at
    500, and each higher rank needs 90 more points.
  練習モードの仮レーティングは、本番モード解放の条件として使われます。: Your practice rating determines when rated modes unlock.
  次の課題プレビューは設定画面で表示方式と長さを変更できます。: Change the next prompt preview style and length in Settings.
  正確無比とIMEあり本番では、ミスをBackspaceで戻すまで先に進めません。: In Accuracy practice and rated mode
    with IME, correct a mistake with Backspace before continuing.
  自動リタイアは、設定から有効にできます。: You can enable automatic retirement in Settings.
  自分の「つまづきパターン」を理解するのが、成長に不可欠です。: Understanding your own mistake patterns is essential for improving.
  たいてい、他人より自分自身と競争するほうが良い結果が出ます。: You will often get better results by competing
    with yourself than with others.
  楽だからといって「エンジニア座り」をしていると、腰を壊すので気をつけましょう。: An easy slouch can strain your back, so pay attention to your posture.
  最高のパフォーマンスを出したいときは、まず机から離れ、爪の長さを確認するといいかも。: For your best performance, take a
    break from your desk and check your fingernail length.
  肩と手首の力を抜き、キーを押す力を必要最小限にすると次の入力が軽くなります。: Relax your shoulders and wrists, and
    press each key with only the force you need.
  焦るより、遅くても正確にやるほうがすべてのモードでスコアが伸びます。: Accuracy helps your score in every mode, even when you type more slowly.
  1日に長時間練習しすぎないようにしましょう。腱鞘炎になります。: Avoid practicing for too long in one day to reduce the risk of tendon strain.
  英文はだいぶ日本語文と感覚が違います。分けて練習しましょう。: Typing English feels quite different from typing
    Japanese. Practice each separately.
  一瞬一瞬のブーストよりも、安定してスラスラ打てるほうがスコアが伸びます。: A steady, smooth rhythm improves your
    score more than occasional bursts of speed.
  単語で反射神経を競わず、長文で実力を磨くのがオススメ。: Build your skill with longer passages instead of
    racing through isolated words.
  文字をうったら、すぐにホームポジションに戻しましょう。: Return to the home row after each keystroke.
  打鍵中、手元を絶対に見てはいけません。絶対です。: Keep your eyes on the screen while typing. No peeking at your hands.
  できるだけ、毎日練習しましょう。それが最短ルートです。: Practice every day when you can. It is the quickest way to improve.
  ずっと練習をするより、実用もするほうが伸びやすくなります。: Mix practice with real-world typing to make progress faster.
  ミスしたキー単体よりも、ミスした組み合わせを見つける方が役に立つかも。: Finding combinations that cause mistakes
    may help more than focusing on a single key.
  常に先読みを意識してみよう。: Try to read ahead as you type.
  高速化とは、文字を速く打つことではなく、迷う時間を減らすこと。: Typing faster is less about moving your fingers
    quickly and more about spending less time hesitating.
  「ci」や「le」など、早く打てる別ルートも無理のない範囲で試してみよう。: Try alternate fast input patterns such as
    “ci” or “le” when they feel comfortable.
