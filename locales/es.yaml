  各SNSの投稿画面にはテンプレート文を入力済みです。画像は貼り付け、未対応ブラウザでは保存して添付できます。: Las ventanas para publicar en redes ya incluyen la plantilla. Pega la imagen o guárdala y adjúntala si el navegador no admite pegar imágenes.
  pre-session tip: Consejo previo a la sesión
  post-session tip: Consejo posterior a la sesión
  本番モードは開始後の入力だけを採点します。: El modo de competición solo cuenta las entradas realizadas después de iniciar.
  本番モードは仮レーティング A0 以上で解放されます。: El modo de competición se desbloquea con un rango provisional A0 o superior.
  IMEあり本番では行を課題と一致させてから Enter で提出します。: En la competición con IME, haz que la línea coincida con la frase y pulsa Enter para enviarla.
  500点未満は NR、500点以上は G0、以降は90点ごとにランクが上がります。: "Menos de 500 puntos: NR; desde 500: G0; el rango aumenta cada 90 puntos."
  練習モードの仮レーティングは、本番モード解放の条件として使われます。: El rango provisional de práctica se usa para desbloquear la competición.
  次の課題プレビューは設定画面で表示方式と長さを変更できます。: Puedes cambiar la presentación y la longitud de la siguiente vista previa en Ajustes.
  正確無比とIMEあり本番では、ミスをBackspaceで戻すまで先に進めません。: En Precisión y en la competición con IME, debes corregir los errores con Backspace antes de avanzar.
  自動リタイアは、設定から有効にできます。: Activa el retiro automático en Ajustes.
  自分の「つまづきパターン」を理解するのが、成長に不可欠です。: Comprender tus patrones de error es esencial para mejorar.
  たいてい、他人より自分自身と競争するほうが良い結果が出ます。: Normalmente, competir contigo mismo da mejores resultados que competir con otras personas.
  楽だからといって「エンジニア座り」をしていると、腰を壊すので気をつけましょう。: Aunque parezca cómoda, la postura encorvada frente al ordenador puede dañarte la espalda.
  最高のパフォーマンスを出したいときは、まず机から離れ、爪の長さを確認するといいかも。: Para rendir mejor, aléjate un momento del escritorio y comprueba que las uñas no estén demasiado largas.
  肩と手首の力を抜き、キーを押す力を必要最小限にすると次の入力が軽くなります。: Relaja los hombros y las muñecas. Pulsa cada tecla con la fuerza justa para escribir con más facilidad.
  焦るより、遅くても正確にやるほうがすべてのモードでスコアが伸びます。: En todos los modos, la precisión mejora la puntuación más que escribir deprisa con errores.
  1日に長時間練習しすぎないようにしましょう。腱鞘炎になります。: Evita practicar durante muchas horas al día para reducir el riesgo de tendinitis.
  英文はだいぶ日本語文と感覚が違います。分けて練習しましょう。: Escribir en inglés se siente muy distinto a escribir en japonés. Practica cada idioma por separado.
  一瞬一瞬のブーストよりも、安定してスラスラ打てるほうがスコアが伸びます。: Un ritmo constante mejora más la puntuación que los impulsos breves de velocidad.
  単語で反射神経を競わず、長文で実力を磨くのがオススメ。: Mejora con textos largos en vez de competir por la rapidez con palabras sueltas.
  文字をうったら、すぐにホームポジションに戻しましょう。: Vuelve a la posición inicial de las manos después de cada tecla.
  打鍵中、手元を絶対に見てはいけません。絶対です。: No mires las manos mientras escribes. En serio.
  できるだけ、毎日練習しましょう。それが最短ルートです。: Practica a diario siempre que puedas. Es la manera más rápida de mejorar.
  ずっと練習をするより、実用もするほうが伸びやすくなります。: Combinar la práctica con la escritura cotidiana ayuda a progresar.
  ミスしたキー単体よりも、ミスした組み合わせを見つける方が役に立つかも。: Puede ser más útil descubrir combinaciones de teclas problemáticas que fijarse en una tecla aislada.
  常に先読みを意識してみよう。: Procura leer por adelantado mientras escribes.
  高速化とは、文字を速く打つことではなく、迷う時間を減らすこと。: Escribir más rápido consiste menos en mover los dedos y más en reducir las dudas.
  「ci」や「le」など、早く打てる別ルートも無理のない範囲で試してみよう。: Prueba rutas de escritura alternativas como «ci» o «le» si te resultan cómodas.
