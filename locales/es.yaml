  画像を準備できませんでした。もう一度お試しください。: No se pudo preparar la imagen. Inténtalo de nuevo.
  共有メニューにリザルト画像を送りました。: La imagen del resultado se envió al menú para compartir.
  共有を完了できませんでした。画像保存をお試しください。: No se pudo compartir. Prueba a guardar la imagen.
  Share APIが使えないため、画像を保存して投稿文をコピーしました。: La API para compartir no está disponible; se guardó la imagen y se copió el texto para publicar.
  "{service}を開きます。画像はPNG保存から添付してください。": Se abrirá {service}. Guarda la imagen PNG y adjúntala.
  "{service}を開きました。投稿画面にリザルト画像を貼り付けてください。": Se abrió {service}. Pega la imagen del resultado en la publicación.
  "{service}を開き、リザルト画像を保存しました。投稿画面で添付してください。": Se abrió {service} y se guardó la imagen del resultado. Adjunta la imagen en la publicación.
  投稿テンプレートをコピーしました。: Plantilla de publicación copiada.
