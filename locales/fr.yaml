  画像を準備できませんでした。もう一度お試しください。: Impossible de préparer l’image. Réessayez.
  共有メニューにリザルト画像を送りました。: L’image du résultat a été envoyée au menu de partage.
  共有を完了できませんでした。画像保存をお試しください。: Le partage a échoué. Essayez d’enregistrer l’image.
  Share APIが使えないため、画像を保存して投稿文をコピーしました。: L’API de partage est indisponible ; l’image a été enregistrée et le texte de publication copié.
  "{service}を開きます。画像はPNG保存から添付してください。": Ouverture de {service}. Enregistrez l’image PNG et joignez-la à la publication.
  "{service}を開きました。投稿画面にリザルト画像を貼り付けてください。": "{service} est ouvert. Collez l’image du résultat dans la publication."
  "{service}を開き、リザルト画像を保存しました。投稿画面で添付してください。": "{service} est ouvert et l’image du résultat a été enregistrée. Joignez-la à la publication."
  投稿テンプレートをコピーしました。: Modèle de publication copié.
  投稿テンプレートをコピーできませんでした。: Impossible de copier le modèle de publication.
