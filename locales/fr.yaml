  文言をコピー: Copier le texte
  各SNSの投稿画面にはテンプレート文を入力済みです。画像は貼り付け、未対応ブラウザでは保存して添付できます。: Le modèle est déjà saisi dans les fenêtres de publication. Collez l’image ou, dans les navigateurs non compatibles, enregistrez-la et joignez-la.
  pre-session tip: Conseil avant la session
  post-session tip: Conseil après la session
  本番モードは開始後の入力だけを採点します。: Le mode compétition ne compte que les saisies effectuées après le démarrage.
  本番モードは仮レーティング A0 以上で解放されます。: Le mode compétition se débloque au rang provisoire A0 ou supérieur.
  IMEあり本番では行を課題と一致させてから Enter で提出します。: En compétition avec IME, faites correspondre la ligne au texte, puis appuyez sur Entrée pour la valider.
  500点未満は NR、500点以上は G0、以降は90点ごとにランクが上がります。: "Sous 500 points : aucun rang ; G0 commence à 500, puis le rang augmente tous les 90 points."
  練習モードの仮レーティングは、本番モード解放の条件として使われます。: Le rang provisoire d’entraînement sert à débloquer le mode compétition.
  次の課題プレビューは設定画面で表示方式と長さを変更できます。: Modifiez l’affichage et la longueur de l’aperçu du texte suivant dans les paramètres.
  正確無比とIMEあり本番では、ミスをBackspaceで戻すまで先に進めません。: En modes Précision et compétition avec IME, corrigez les erreurs avec Retour arrière avant de continuer.
  自動リタイアは、設定から有効にできます。: Activez l’abandon automatique dans les paramètres.
  自分の「つまづきパターン」を理解するのが、成長に不可欠です。: Comprendre ses propres habitudes d’erreur est essentiel pour progresser.
  たいてい、他人より自分自身と競争するほうが良い結果が出ます。: Se mesurer à soi-même donne souvent de meilleurs résultats que de rivaliser avec les autres.
  楽だからといって「エンジニア座り」をしていると、腰を壊すので気をつけましょう。: Même si elle semble confortable, une posture avachie devant le bureau peut faire mal au dos.
  最高のパフォーマンスを出したいときは、まず机から離れ、爪の長さを確認するといいかも。: Pour une meilleure performance, éloignez-vous un instant du bureau et vérifiez la longueur de vos ongles.
  肩と手首の力を抜き、キーを押す力を必要最小限にすると次の入力が軽くなります。: Détendez les épaules et les poignets. Appuyez sur les touches avec juste la force nécessaire.
  焦るより、遅くても正確にやるほうがすべてのモードでスコアが伸びます。: Dans tous les modes, la précision fait plus progresser le score que la vitesse avec des erreurs.
  1日に長時間練習しすぎないようにしましょう。腱鞘炎になります。: Évitez de vous entraîner trop longtemps dans la journée afin de limiter le risque de tendinite.
  英文はだいぶ日本語文と感覚が違います。分けて練習しましょう。: La frappe en anglais est très différente de celle en japonais. Entraînez-vous dans chaque langue séparément.
  一瞬一瞬のブーストよりも、安定してスラスラ打てるほうがスコアが伸びます。: Un rythme régulier améliore davantage le score que de courtes accélérations.
  単語で反射神経を競わず、長文で実力を磨くのがオススメ。: Progressez avec des textes longs plutôt qu’en rivalisant sur des mots isolés.
  文字をうったら、すぐにホームポジションに戻しましょう。: Ramenez vos doigts à la position de base après chaque frappe.
  打鍵中、手元を絶対に見てはいけません。絶対です。: Ne regardez pas vos mains en tapant. Jamais.
  できるだけ、毎日練習しましょう。それが最短ルートです。: Entraînez-vous chaque jour quand vous le pouvez. C’est le chemin le plus court pour progresser.
  ずっと練習をするより、実用もするほうが伸びやすくなります。: Alterner entraînement et saisie au quotidien aide à progresser.
  ミスしたキー単体よりも、ミスした組み合わせを見つける方が役に立つかも。: Repérer les combinaisons de touches à l’origine d’erreurs peut être plus utile que de se focaliser sur une touche.
  常に先読みを意識してみよう。: Essayez de lire quelques mots à l’avance pendant la saisie.
  高速化とは、文字を速く打つことではなく、迷う時間を減らすこと。: Taper plus vite consiste moins à accélérer les doigts qu’à réduire les hésitations.
  「ci」や「le」など、早く打てる別ルートも無理のない範囲で試してみよう。: Essayez d’autres suites rapides comme « ci » ou « le » si elles vous conviennent.
