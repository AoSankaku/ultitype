  画像を準備できませんでした。もう一度お試しください。: छवि तैयार नहीं हो सकी। फिर से प्रयास करें।
  共有メニューにリザルト画像を送りました。: परिणाम छवि शेयर मेनू में भेजी गई।
  共有を完了できませんでした。画像保存をお試しください。: शेयर पूरा नहीं हुआ। छवि सहेजकर देखें।
  Share APIが使えないため、画像を保存して投稿文をコピーしました。: Share API उपलब्ध नहीं है; छवि सहेजी गई और पोस्ट का पाठ कॉपी हुआ।
  "{service}を開きます。画像はPNG保存から添付してください。": "{service} खोला जा रहा है। PNG छवि सहेजकर पोस्ट में जोड़ें।"
  "{service}を開きました。投稿画面にリザルト画像を貼り付けてください。": "{service} खुल गया है। परिणाम छवि पोस्ट में पेस्ट करें।"
  "{service}を開き、リザルト画像を保存しました。投稿画面で添付してください。": "{service} खुल गया और परिणाम छवि सहेजी गई। पोस्ट में छवि संलग्न करें।"
  投稿テンプレートをコピーしました。: पोस्ट टेम्पलेट कॉपी हो गया।
  投稿テンプレートをコピーできませんでした。: पोस्ट टेम्पलेट कॉपी नहीं हो सका।
  SNS用リザルト画像: सोशल मीडिया के लिए परिणाम छवि
  "{mode}のリザルト画像。ランク{rank}、{score}ポイント": "{mode} का परिणाम। रैंक {rank}, {score} अंक"
  文言をコピー: पाठ कॉपी करें
  各SNSの投稿画面にはテンプレート文を入力済みです。画像は貼り付け、未対応ブラウザでは保存して添付できます。: सोशल मीडिया पोस्ट में टेम्पलेट पहले से भरा है। छवि पेस्ट करें या असमर्थित ब्राउज़र में सहेजकर संलग्न करें।
  pre-session tip: सत्र से पहले सुझाव
  post-session tip: सत्र के बाद सुझाव
  本番モードは開始後の入力だけを採点します。: रेटिंग मोड केवल शुरू करने के बाद की टाइपिंग गिनता है।
  本番モードは仮レーティング A0 以上で解放されます。: रेटिंग मोड A0 या उससे ऊपर की अस्थायी रैंक पर अनलॉक होता है।
  IMEあり本番では行を課題と一致させてから Enter で提出します。: IME रेटिंग में पंक्ति प्रॉम्प्ट से मेल होने पर Enter दबाकर जमा करें।
  500点未満は NR、500点以上は G0、以降は90点ごとにランクが上がります。: "500 से कम: कोई रैंक नहीं; G0 500 से शुरू होता है, फिर हर 90 अंक पर अगला रैंक मिलता है।"
  練習モードの仮レーティングは、本番モード解放の条件として使われます。: अस्थायी अभ्यास रैंक रेटिंग मोड अनलॉक करने के लिए इस्तेमाल होता है।
  次の課題プレビューは設定画面で表示方式と長さを変更できます。: सेटिंग में अगले प्रॉम्प्ट का प्रदर्शन और लंबाई बदलें।
  正確無比とIMEあり本番では、ミスをBackspaceで戻すまで先に進めません。: सटीकता और IME रेटिंग मोड में आगे बढ़ने से पहले Backspace से गलती सुधारें।
  自動リタイアは、設定から有効にできます。: सेटिंग से स्वतः छोड़ना चालू करें।
  自分の「つまづきパターン」を理解するのが、成長に不可欠です。: अपनी गलती के पैटर्न समझना सुधार के लिए ज़रूरी है।
  たいてい、他人より自分自身と競争するほうが良い結果が出ます。: अक्सर दूसरों से प्रतिस्पर्धा करने की बजाय खुद से मुकाबला करने पर बेहतर नतीजे मिलते हैं।
  楽だからといって「エンジニア座り」をしていると、腰を壊すので気をつけましょう。: आरामदेह लगने पर भी झुककर बैठने से पीठ को नुकसान हो सकता है।
  最高のパフォーマンスを出したいときは、まず机から離れ、爪の長さを確認するといいかも。: बेहतर प्रदर्शन के लिए डेस्क से उठें और नाखूनों की लंबाई जाँचें।
  肩と手首の力を抜き、キーを押す力を必要最小限にすると次の入力が軽くなります。: कंधे और कलाई ढीली रखें। हर कुंजी को ज़रूरत भर दबाएँ।
  焦るより、遅くても正確にやるほうがすべてのモードでスコアが伸びます。: हर मोड में, गलतियों के साथ तेज़ टाइप करने से सटीक टाइपिंग स्कोर अधिक बढ़ाती है।
  1日に長時間練習しすぎないようにしましょう。腱鞘炎になります。: टेंडन की समस्या से बचने के लिए एक दिन में बहुत देर तक अभ्यास न करें।
  英文はだいぶ日本語文と感覚が違います。分けて練習しましょう。: अंग्रेज़ी और जापानी टाइपिंग का अनुभव अलग है। दोनों का अलग-अलग अभ्यास करें।
  一瞬一瞬のブーストよりも、安定してスラスラ打てるほうがスコアが伸びます。: छोटी तेज़ छलाँगों से बेहतर है स्थिर और सहज लय।
  単語で反射神経を競わず、長文で実力を磨くのがオススメ。: अलग-अलग शब्दों की गति से मुकाबला करने के बजाय लंबे पाठ से कौशल बढ़ाएँ।
  文字をうったら、すぐにホームポジションに戻しましょう。: हर कीस्ट्रोक के बाद हाथों को होम पोज़िशन पर लाएँ।
  打鍵中、手元を絶対に見てはいけません。絶対です。: टाइप करते समय हाथों को बिल्कुल न देखें।
  できるだけ、毎日練習しましょう。それが最短ルートです。: हो सके तो रोज़ अभ्यास करें। यही सुधार का सबसे छोटा रास्ता है।
  ずっと練習をするより、実用もするほうが伸びやすくなります。: सिर्फ अभ्यास करने से बेहतर है कि असली काम के लिए भी टाइप करें।
