  各SNSの投稿画面にはテンプレート文を入力済みです。画像は貼り付け、未対応ブラウザでは保存して添付できます。: Templat unggahan sudah siap di setiap aplikasi sosial. Tempel gambar, atau simpan dan lampirkan di browser yang tidak mendukung berbagi gambar.
  pre-session tip: Tips sebelum sesi
  post-session tip: Tips setelah sesi
  本番モードは開始後の入力だけを採点します。: Sesi berperingkat hanya menghitung input setelah dimulai.
  本番モードは仮レーティング A0 以上で解放されます。: Mode peringkat terbuka saat peringkat latihan mencapai A0 atau lebih tinggi.
  IMEあり本番では行を課題と一致させてから Enter で提出します。: Dalam mode peringkat dengan IME, samakan baris soal lalu tekan Enter untuk mengirim.
  500点未満は NR、500点以上は G0、以降は90点ごとにランクが上がります。: Skor di bawah 500 adalah NR. G0 dimulai pada 500 dan setiap tingkat lebih tinggi memerlukan tambahan 90 poin.
  練習モードの仮レーティングは、本番モード解放の条件として使われます。: Peringkat latihan menentukan kapan mode peringkat terbuka.
  次の課題プレビューは設定画面で表示方式と長さを変更できます。: Ubah gaya dan panjang pratinjau soal berikutnya di Pengaturan.
  正確無比とIMEあり本番では、ミスをBackspaceで戻すまで先に進めません。: Dalam latihan Akurasi dan mode peringkat dengan IME, perbaiki kesalahan dengan Backspace sebelum melanjutkan.
  自動リタイアは、設定から有効にできます。: Anda dapat mengaktifkan pensiun otomatis di Pengaturan.
  自分の「つまづきパターン」を理解するのが、成長に不可欠です。: Memahami pola kesalahan sendiri penting untuk berkembang.
  たいてい、他人より自分自身と競争するほうが良い結果が出ます。: Bersaing dengan diri sendiri sering memberi hasil yang lebih baik daripada dengan orang lain.
  楽だからといって「エンジニア座り」をしていると、腰を壊すので気をつけましょう。: Duduk membungkuk dapat membebani punggung, jadi perhatikan postur.
  最高のパフォーマンスを出したいときは、まず机から離れ、爪の長さを確認するといいかも。: Untuk performa terbaik, beristirahatlah dari meja dan periksa panjang kuku.
  肩と手首の力を抜き、キーを押す力を必要最小限にすると次の入力が軽くなります。: Rilekskan bahu dan pergelangan tangan, tekan tombol secukupnya.
  焦るより、遅くても正確にやるほうがすべてのモードでスコアが伸びます。: Akurasi meningkatkan skor dalam semua mode, meskipun Anda mengetik lebih lambat.
  1日に長時間練習しすぎないようにしましょう。腱鞘炎になります。: Hindari berlatih terlalu lama sehari untuk mengurangi risiko cedera tendon.
  英文はだいぶ日本語文と感覚が違います。分けて練習しましょう。: Mengetik bahasa Inggris terasa berbeda dari bahasa Jepang. Berlatihlah secara terpisah.
  一瞬一瞬のブーストよりも、安定してスラスラ打てるほうがスコアが伸びます。: Ritme yang stabil dan lancar lebih meningkatkan skor daripada sesekali mengetik cepat.
  単語で反射神経を競わず、長文で実力を磨くのがオススメ。: Asah kemampuan dengan teks panjang, bukan berlomba mengetik kata satuan.
  文字をうったら、すぐにホームポジションに戻しましょう。: Kembalikan jari ke baris dasar setelah setiap ketukan.
  打鍵中、手元を絶対に見てはいけません。絶対です。: Tetap lihat layar saat mengetik. Jangan intip tangan.
  できるだけ、毎日練習しましょう。それが最短ルートです。: Berlatihlah setiap hari jika memungkinkan. Ini cara tercepat untuk berkembang.
  ずっと練習をするより、実用もするほうが伸びやすくなります。: Gabungkan latihan dengan mengetik sehari-hari agar lebih cepat berkembang.
  ミスしたキー単体よりも、ミスした組み合わせを見つける方が役に立つかも。: Mencari kombinasi tombol yang sering salah mungkin lebih berguna daripada satu tombol.
  常に先読みを意識してみよう。: Cobalah membaca ke depan saat mengetik.
  高速化とは、文字を速く打つことではなく、迷う時間を減らすこと。: Mengetik lebih cepat bukan soal gerakan jari saja, tetapi juga mengurangi keraguan.
  「ci」や「le」など、早く打てる別ルートも無理のない範囲で試してみよう。: Jika nyaman, coba pola input cepat seperti “ci” atau “le”.
