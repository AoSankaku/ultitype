{meta: {code: it,name: Italiano,direction: ltr},messages: {UltiType header: UltiType,Typing practice and rating: Allenamento di scrittura e valutazioni,ランクガイド: Guida alle classifiche,"ランクガイド（現在 {rank}）": "Guida alle classifiche (attuale: {rank})",仮: Allenamento,本: Valutazione,ユーザー: Utente,設定: Impostazioni,戻る: Indietro,settings: impostazioni,theme: tema,画面: Schermo,テーマ: Tema,表示テーマを切り替える: Scegli un tema colore.,入力画面と入力方式: Schermata di digitazione e metodi di input,練習画面のモックを見ながら入力方式と表示を調整する: "Regola i metodi di input e la visualizzazione usando un'anteprima della schermata di allenamento.",開く: Apri,サウンド: Suoni,タイプ音とUI/結果音の音量、カテゴリ別のON/OFFを調整します。: "Regola il volume dei suoni di digitazione e dell'interfaccia e attiva o disattiva ogni categoria.",音量: Volume,タイプ音: Suoni di digitazione,UI/結果音: Suoni interfaccia/risultati,自動リタイア: Chiusura automatica sessione,無入力リタイア: Chiusura per inattività,0 秒で無効: Imposta 0 per disattivare,無入力リタイア秒数: Secondi di inattività prima della chiusura,秒: s,秒数を調整: Regola i secondi,1秒増やす: Aggiungi 1 secondo,1秒減らす: Sottrai 1 secondo,連続誤打鍵リタイア: Chiusura dopo errori consecutivi,0 打鍵で無効: Imposta 0 per disattivare,連続誤打鍵数: Numero di errori consecutivi,打鍵: battute,正誤率ボーダー: Soglia di precisione,0% で無効: Imposta 0% per disattivare,その他の設定: Altre impostazioni,次の課題の表示文字数: Lunghezza anteprima esercizio successivo,短文練習モードで次に出る課題文の冒頭を表示する。0文字で非表示: "Mostra l'inizio del testo successivo nell'allenamento breve. Imposta 0 per nasconderlo.",文字: caratteri,次の課題の表示文字数を調整: "Regola la lunghezza dell'anteprima",次の課題の表示文字数を増やす: "Aumenta la lunghezza dell'anteprima",次の課題の表示文字数を減らす: "Riduci la lunghezza dell'anteprima",危険な操作: Operazioni di eliminazione,データと設定を消去: Cancella dati e impostazioni,ユーザーデータだけの削除、設定だけの初期化、またはその両方を選ぶ: "Scegli se cancellare i dati utente, ripristinare le impostazioni o fare entrambe le cose.",ユーザーデータ: Dati utente,設定を初期化: Ripristina impostazioni,両方: Entrambe,スコアと履歴だけを削除します。設定は残します。よろしいですか？: Eliminare punteggi e cronologia mantenendo le impostazioni?,設定をすべて初期値