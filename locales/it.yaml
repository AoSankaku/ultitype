 livello.,入力待ち: In attesa di input,課題終了まで非表示: Nascosto fino al termine del testo,正誤率: Precisione,"ミス {count}": "Errori: {count}",正誤履歴: Cronologia delle risposte corrette e sbagliate,平均打鍵間隔: Intervallo medio tra le battute,ズレ平均: Scostamento medio,物理打鍵: Pressioni fisiche dei tasti,打鍵間隔の安定度グラフ: Grafico della stabilità del ritmo di digitazione,"あと {count} 回": "Ancora {count}",残り時間: Tempo rimanente,残り時間（％）: Tempo rimanente (%),打鍵/秒: Battute/s,打鍵/分: Battute/min,かな文字/秒: Caratteri kana/s,課題文字/秒: Caratteri del testo/s,正確率: Precisione,ミス数: Numero di errori,完了課題: Testi completati,ミス/物理打鍵: Errori/pressioni fisiche dei tasti,正解/物理打鍵: Risposte corrette/pressioni fisiche dei tasti,開始: Avvia,修正: Correzione,正打: Corretto,ミス: Errore,モード選択: Scegli modalità,リセット: Reimposta,無入力が続いたためリタイアしました: Sessione terminata per inattività prolungata,"セッション終了: {rank} / {score}": "Sessione terminata: {rank} / {score}",開始ボタン、またはここで入力を始める: Premi Avvia o inizia a digitare qui,IMEありで入力し、行が一致したら Enter: Digita con IME e premi Enter quando la riga corrisponde,英文を入力し、行が一致したら Enter: Digita la riga in inglese e premi Enter quando corrisponde,typing input: Campo di digitazione,direct keyboard capture: Acquisizione diretta della tastiera,resize typing input: Ridimensiona il campo di digitazione,Rank hidden for the first 30 seconds: Livello nascosto per i primi 30 secondi,タイピング: Digitazione,速度だけじゃない。精度と安定性まで、次の一打へ。: "Non conta solo la velocità. Precisione e costanza, a ogni battuta.",速さだけじゃない。精度と安定性まで、次の一打へ。: "Non solo velocità: precisione e costanza, a ogni battuta.",Tips: Suggerimenti,typing practice: Esercizi di digitazione,Live Analysis: Analisi in tempo reale,"{key} / {interval} / {state}": "{key} / {interval} / {state}",画像を準備できませんでした。もう一度お試しください。: "Impossibile preparare l'immagine. Riprova.",共有メニューにリザルト画像を送りました。: Immagine del risultato inviata al menu di condivisione.,共有を完了できませんでした。画像保存をお試しください。: "Condivisione non riuscita. Prova a salvare l'immagine.",Share APIが使えないため、画像を保存して投稿文をコピーしました。: "L'API di condivisione non è disponibile: l'immagine è stata salvata e il testo del post copiato.","{service}を開きます。画像はPNG保存から添付してください。": "Apertura di {service}. Salva il PNG e allegalo al post.","{service}を開きました。投稿画面にリザルト画像を貼り付けてください。": "{service} è stato aperto. Inserisci l'immagine del risultato nel post.","{service}を開き、リザルト画像を保存しました。投稿画面で添付してください。": "{service} è stato aperto e l'immagine del risultato è stata salvata. Allegala nella schermata del post.",投稿テンプレートをコピーしました。: Modello del post copiato.,投稿テンプレートをコピーできませんでした。: Impossibile copiare il modello del post.,SNS用リザルト画像: Immagine del risultato per i social,"{mode}のリザルト画像。ランク{rank}、{score}ポイント": "Immagine del risultato {mode}: livello {rank}, {score} punti",文言をコピー: Copia testo,各SNSの投稿画面にはテンプレート文を入力済みです。画像は貼り付け、未対応ブラウザでは保存して添付できます。: "Il modello del post è già inserito nella schermata di pubblicazione di ogni social. Incolla l'immagine oppure, se il browser non lo consente, salvala e allegala.",pre-session tip: Consiglio prima della sessione,post-session tip: Consiglio dopo la sessione,本番モードは開始後の入力だけを採点します。: Le sessioni ufficiali valutano solo ciò che digiti dopo averle avviate.,本番モードは仮レーティング A0 以上で解放されます。: Le modalità ufficiali si sbloccano con un livello di prova A0 o superiore.,IMEあり本番では行を課題と一致させてから Enter で提出します。: "Nella modalità ufficiale con IME, fai corrispondere la riga al testo e premi Enter per inviarla.",500点未満は NR、500点以上は G0、以降は90点ごとにランクが上がります。: "Sotto i 500 punti: NR; da 500: G0. Il livello sale ogni 90 punti.",練習モードの仮レーティングは、本番モード解放の条件として使われます。: "Il livello di prova ottenuto in allenamento determina l'accesso alle modalità ufficiali.",次の課題プレビューは設定画面で表示方式と長さを変更できます。: Puoi cambiare nelle impostazioni il tipo di anteprima del testo successivo e la sua lunghezza.,正確無比とIMEあり本番では、ミスをBackspaceで戻すまで先に進めません。: "Nella modalità Precisione e nella modalità ufficiale con IME, correggi l'errore con Backspace prima di continuare.",自動リタイアは、設定から有効にできます。: Puoi attivare il ritiro automatico nelle impostazioni.,自分の「つまづきパターン」を理解するのが、成長に不可欠です。: Capire i propri schemi di errore è fondamentale per migliorare.,たいてい、他人より自分自身と競争するほうが良い結果が出ます。: Spesso si ottengono risultati migliori facendo a gara con sé stessi anziché con gli altri.,楽だからといって「エンジニア座り」をしていると、腰を壊すので気をつけましょう。: "Anche se è comodo, evita di stare curvo alla scrivania: può farti male alla schiena.",最高のパフォーマンスを出したいときは、まず机から離れ、爪の長さを確認するといいかも。: "Per ottenere il massimo, allontanati dalla scrivania e controlla la lunghezza delle unghie.",肩と手首の力を抜き、キーを押す力を必要最小限にすると次の入力が軽くなります。: "Rilassa spalle e polsi e premi i tasti con la minima forza necessaria: la digitazione successiva sarà più leggera.",焦るより、遅くても正確にやるほうがすべてのモードでスコアが伸びます。: "La precisione migliora il punteggio in ogni modalità, anche se digiti più lentamente.",1日に長時間練習しすぎないようにしましょう。腱鞘炎になります。: Evita di allenarti troppo a lungo in un solo giorno per non sovraccaricare i tendini.,英文はだいぶ日本語文と感覚が違います。分けて練習しましょう。: Digitare in inglese è molto diverso dal digitare in giapponese. Allenati separatamente.,一瞬一瞬のブーストよりも、安定してスラスラ打てるほうがスコアが伸びます。: Un ritmo costante e fluido migliora il punteggio più di occasionali scatti di velocità.,単語で反射神経を競わず、長文で実力を磨くのがオススメ。: Migliora con testi lunghi invece di gareggiare sulla velocità delle singole parole.,文字をうったら、すぐにホームポジションに戻しましょう。: "Dopo aver digitato un carattere, riporta subito le dita sulla riga di base.",打鍵中、手元を絶対に見てはいけません。絶対です。: "Mentre digiti, non guardare mai le mani. Mai.",できるだけ、毎日練習しましょう。それが最短ルートです。: "Allenati ogni giorno, quando puoi. È il modo più rapido per migliorare.",ずっと練習をするより、実用もするほうが伸びやすくなります。: "Alternare l'allenamento alla digitazione nella vita reale aiuta a progredire più in fretta.",ミスしたキー単体よりも、ミスした組み合わせを見つける方が役に立つかも。: Potrebbe essere più utile individuare le combinazioni di tasti che sbagli che concentrarti su un singolo tasto.,常に先読みを意識してみよう。: Cerca sempre di leggere in anticipo mentre digiti.,高速化とは、文字を速く打つことではなく、迷う時間を減らすこと。: "Digitare più velocemente non significa muovere le dita più in fretta, ma esitare meno.",「ci」や「le」など、早く打てる別ルートも無理のない範囲で試してみよう。: "Prova percorsi alternativi più rapidi, come «ci» o «le», se ti risultano comodi.",入力画面設定: Impostazioni della schermata di digitazione,画面設定: Impostazioni schermo,入力画面のプレビュー: Anteprima della schermata di digitazione,一時停止: Pausa,10.0打鍵/秒プレビュー: "Anteprima a 10,0 battute/s",5.0打鍵/秒プレビュー: "Anteprima a 5,0 battute/s",プレビューの課題文: Anteprima del testo,短文: Testo breve,長文: Testo lungo,入力画面: Schermata di digitazione,フォント: Caratteri,表示順: Ordine di visualizzazione,漢字・ふりがな・ひらがな表示に使うGoogle Fonts: "Google Fonts usati per kanji, furigana e hiragana",日本語フォント: Font giapponese,ローマ字・英語課題文に使うGoogle Fonts: Google Fonts usati per romaji e testi in inglese,英語フォント: Font inglese,入力画面の表示順: Ordine degli elementi nella schermata di digitazione,ドラッグで入力画面の行順を変更する。非表示中の項目も順序を保持する: Trascina per riordinare le righe della schermata. Gli elementi nascosti mantengono la propria posizione.,表示中: Visibile,非表示中: Nascosto,上部表示情報: Informazioni in alto,表示する情報: Informazioni da mostrare,残り時間を外しても、残り時間バーは表示されます。: La barra del tempo rimanente resta visibile anche se nascondi il valore del tempo.,入力方式: Metodo di input,ローマ字入力法: Metodo di input romaji,許容する派生と、ガイドで優先表示する表記を選ぶ: Scegli le varianti accettate e la grafia preferita nella guida.,すべて分割: Tutte separate,すべて統合: Tutte unite,個別設定: Personalizzato,ヘボン式優先: Preferisci Hepburn,最短優先: Preferisci la più breve,促音入力: Input delle consonanti doppie,促音入力候補: Input accettati per le consonanti doppie,「っ」の子音重複と ltsu / xtsu / ltu / xtu の扱いを選ぶ: Scegli come gestire le consonanti doppie e ltsu / xtsu / ltu / xtu per inserire っ.,促音分割を許可: "Consenti l'input separato delle consonanti doppie",表示: Grafia preferita,一般拗音分割入力: Input separato per gli yōon comuni,「きゃ」を kya だけでなく kila / kixa でも入力できるようにする: "Consenti di digitare きゃ anche come kila o kixa, oltre a kya.",特殊拗音入力法: Metodo di input per gli yōon speciali,出現頻度の低い外来語カナを統合形で打つか、分割形で打つかを選ぶ: Scegli se digitare i kana meno comuni dei prestiti linguistici uniti o separati.,ローマ字: Romaji,ローマ字マーカー: Indicatore romaji,入力中の位置をローマ字表示に下線で表示する。ON推奨: Sott