  この画面幅はサポート対象外です: 이 화면 너비는 지원되지 않습니다
  UltiType は 520px 以上のデスクトップ画面向けです。現在の表示ではデスクトップ向けレイアウトを維持します。: UltiType는 너비가 520px 이상인 데스크톱 화면용입니다. 현재 데스크톱 레이아웃이 표시됩니다.
  以後表示しない: 다시 표시 안 함
  警告を閉じる: 경고 닫기
  ランク到達状況: 등급 진행 상황
