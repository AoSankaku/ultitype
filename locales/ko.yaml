  スコアと履歴だけを削除します。設定は残します。よろしいですか？: 설정을 유지하고 점수와 기록만 삭제할까요?
  設定をすべて初期値に戻します。スコアと履歴は残します。よろしいですか？: 점수와 기록을 유지하고 모든 설정을 초기화할까요?
  スコア、履歴、設定をすべて削除します。よろしいですか？: 모든 점수, 기록 및 설정을 삭제할까요?
  アプリの表示言語: 앱 언어
  画面に表示する言語を選択します。練習する言語はモード選択画面で変更できます。: 화면에 표시할 언어를 선택합니다. 연습 언어는 모드 선택 화면에서 변경할 수 있습니다.
  日本語: 일본어
  English: 영어
  ダーク: 어둡게
