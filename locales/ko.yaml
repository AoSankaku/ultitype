  フォント: 글꼴
  表示順: 표시 순서
  漢字・ふりがな・ひらがな表示に使うGoogle Fonts: 한자, 후리가나, 히라가나 표시에 사용할 Google Fonts
  日本語フォント: 일본어 글꼴
  ローマ字・英語課題文に使うGoogle Fonts: 로마자와 영어 문장에 사용할 Google Fonts
  英語フォント: 영어 글꼴
  入力画面の表示順: 입력 화면 표시 순서
  ドラッグで入力画面の行順を変更する。非表示中の項目も順序を保持する: 드래그하여 입력 화면의 행 순서를 바꾸세요. 숨긴 항목도 순서가 유지됩니다.
  表示中: 표시
  非表示中: 숨김
