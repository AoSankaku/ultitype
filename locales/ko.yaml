  基本のスコア計算式: 기본 점수 계산식
  打鍵/秒 × 1000 × 正確率^モード係数 × 補正: 초당 타건 수 × 1000 × 정확도^모드 계수 × 보정값
  正確率は正しく入力した文字数 ÷ 入力を試みた文字数です。均等モードのみ、打鍵間隔の安定度が補正として加わります。: 정확도는 올바르게 입력한 문자 수를 입력 시도 문자 수로 나눈 값입니다. Flow 모드에서만 타이핑 리듬 안정도가 보정값으로 적용됩니다.
  正確率係数: 정확도 계수
  補正: 보정값
