  開始ボタン、またはここで入力を始める: 시작을 누르거나 여기서 입력을 시작하세요
  IMEありで入力し、行が一致したら Enter: IME로 입력하고 줄이 일치하면 Enter를 누르세요
  英文を入力し、行が一致したら Enter: 영어 줄을 입력하고 일치하면 Enter를 누르세요
  typing input: 타이핑 입력
  direct keyboard capture: 직접 키보드 입력 캡처
  resize typing input: 타이핑 입력 크기 조정
  Rank hidden for the first 30 seconds: 처음 30초 동안 등급 숨김
  タイピング: 타이핑
  速度だけじゃない。精度と安定性まで、次の一打へ。: 속도만이 아닙니다. 모든 타건에서 정확도와 안정성도 키워 보세요.
  速さだけじゃない。精度と安定性まで、次の一打へ。: 속도만이 아닙니다. 모든 타건에서 정확도와 안정성도 키워 보세요.
  Tips: 팁
  typing practice: 타이핑 연습
  Live Analysis: 실시간 분석
  "{key} / {interval} / {state}": "{key} / {interval} / {state}"
  画像を準備できませんでした。もう一度お試しください。: 이미지를 준비하지 못했습니다. 다시 시도해 주세요.
  共有メニューにリザルト画像を送りました。: 결과 이미지를 공유 메뉴로 보냈습니다.
  共有を完了できませんでした。画像保存をお試しください。: 공유하지 못했습니다. 이미지를 저장해 보세요.
  Share APIが使えないため、画像を保存して投稿文をコピーしました。: 공유 API를 사용할 수 없어 이미지를 저장하고 게시글 내용을 복사했습니다.
  "{service}を開きます。画像はPNG保存から添付してください。": "{service}을(를) 엽니다. PNG를 저장한 뒤 게시글에 첨부하세요."
  "{service}を開きました。投稿画面にリザルト画像を貼り付けてください。": "{service}을(를) 열었습니다. 결과 이미지를 게시글에 붙여넣으세요."
  "{service}を開き、リザルト画像を保存しました。投稿画面で添付してください。": "{service}을(를) 열고 결과 이미지를 저장했습니다. 게시글에 첨부하세요."
  投稿テンプレートをコピーしました。: 게시글 문구를 복사했습니다.
  投稿テンプレートをコピーできませんでした。: 게시글 문구를 복사하지 못했습니다.
  SNS用リザルト画像: 소셜 미디어 결과 이미지
  "{mode}のリザルト画像。ランク{rank}、{score}ポイント": "{mode} 결과 이미지: 등급 {rank}, {score}점"
  文言をコピー: 문구 복사
  各SNSの投稿画面にはテンプレート文を入力済みです。画像は貼り付け、未対応ブラウザでは保存して添付できます。: 각 소셜 앱에 게시글 문구가 준비되어 있습니다. 이미지를 붙여넣고, 이미지 공유를 지원하지 않는 브라우저에서는 저장 후 첨부하세요.
  pre-session tip: 세션 전 팁
  post-session tip: 세션 후 팁
  本番モードは開始後の入力だけを採点します。: 등급전에서는 시작 후 입력한 내용만 채점합니다.
  本番モードは仮レーティング A0 以上で解放されます。: 연습 등급이 A0 이상이면 등급전이 해제됩니다.
  IMEあり本番では行を課題と一致させてから Enter で提出します。: IME 사용 등급전에서는 문제와 줄이 일치하면 Enter를 눌러 제출하세요.
  500点未満は NR、500点以上は G0、以降は90点ごとにランクが上がります。: 500점 미만은 NR입니다. G0는 500점부터 시작하며 등급마다 90점이 더 필요합니다.
  練習モードの仮レーティングは、本番モード解放の条件として使われます。: 연습 등급에 따라 등급전 해제 시점이 정해집니다.
  次の課題プレビューは設定画面で表示方式と長さを変更できます。: 설정에서 다음 문제 미리보기 방식과 길이를 변경할 수 있습니다.
  正確無比とIMEあり本番では、ミスをBackspaceで戻すまで先に進めません。: 정확도 연습과 IME 사용 등급전에서는 Backspace로 오타를 고쳐야 계속할 수 있습니다.
  自動リタイアは、設定から有効にできます。: 설정에서 자동 종료를 켤 수 있습니다.
  自分の「つまづきパターン」を理解するのが、成長に不可欠です。: 자신의 실수 패턴을 파악하는 것이 실력 향상에 중요합니다.
  たいてい、他人より自分自身と競争するほうが良い結果が出ます。: 다른 사람보다 자기 자신과 경쟁할 때 더 좋은 결과를 얻는 경우가 많습니다.
  楽だからといって「エンジニア座り」をしていると、腰を壊すので気をつけましょう。: 편하다고 구부정하게 앉으면 허리에 무리가 갈 수 있으니 자세에 신경 쓰세요.
  最高のパフォーマンスを出したいときは、まず机から離れ、爪の長さを確認するといいかも。: 최상의 컨디션을 위해 책상에서 잠시 벗어나 손톱 길이도 확인해 보세요.
  肩と手首の力を抜き、キーを押す力を必要最小限にすると次の入力が軽くなります。: 어깨와 손목에 힘을 풀고 필요한 만큼만 키를 누르세요.
  焦るより、遅くても正確にやるほうがすべてのモードでスコアが伸びます。: 조금 느리더라도 정확하면 모든 모드에서 점수가 올라갑니다.
  1日に長時間練習しすぎないようにしましょう。腱鞘炎になります。: 힘줄에 무리가 가지 않도록 하루에 너무 오래 연습하지 마세요.
  英文はだいぶ日本語文と感覚が違います。分けて練習しましょう。: 영어와 일본어 타이핑은 느낌이 많이 다릅니다. 따로 연습해 보세요.
  一瞬一瞬のブーストよりも、安定してスラスラ打てるほうがスコアが伸びます。: 가끔 속도를 내는 것보다 일정하고 부드러운 리듬이 점수 향상에 도움이 됩니다.
  単語で反射神経を競わず、長文で実力を磨くのがオススメ。: 단어만 빠르게 입력하기보다 긴 문장으로 실력을 키우세요.
  文字をうったら、すぐにホームポジションに戻しましょう。: 키를 누를 때마다 손가락을 홈 포지션으로 돌려놓으세요.
  打鍵中、手元を絶対に見てはいけません。絶対です。: 타이핑할 때는 화면을 보세요. 손을 내려다보지 마세요.
  できるだけ、毎日練習しましょう。それが最短ルートです。: 가능하면 매일 연습하세요. 실력을 키우는 가장 빠른 방법입니다.
  ずっと練習をするより、実用もするほうが伸びやすくなります。: 연습과 실제 타이핑을 병행하면 더 빠르게 늘 수 있습니다.
  ミスしたキー単体よりも、ミスした組み合わせを見つける方が役に立つかも。: 특정 키 하나보다 오타가 나는 조합을 찾는 것이 더 도움이 될 수 있습니다.
  常に先読みを意識してみよう。: 타이핑하면서 다음 내용을 미리 읽어 보세요.
  高速化とは、文字を速く打つことではなく、迷う時間を減らすこと。: 빠른 타이핑은 손가락을 빨리 움직이기보다 망설이는 시간을 줄이는 것입니다.
  「ci」や「le」など、早く打てる別ルートも無理のない範囲で試してみよう。: 편하다면 “ci”나 “le”처럼 빠른 입력 방식을 시도해 보세요.
  入力画面設定: 입력 화면 설정
  画面設定: 화면 설정
  入力画面のプレビュー: 입력 화면 미리보기
