  画像を準備できませんでした。もう一度お試しください。: Imej tidak dapat disediakan. Sila cuba lagi.
  共有メニューにリザルト画像を送りました。: Imej keputusan telah dihantar ke menu kongsi.
  共有を完了できませんでした。画像保存をお試しください。: Perkongsian gagal. Cuba simpan imej.
  Share APIが使えないため、画像を保存して投稿文をコピーしました。: API kongsi tidak tersedia. Imej telah disimpan dan teks kiriman disalin.
  "{service}を開きます。画像はPNG保存から添付してください。": Membuka {service}. Simpan PNG dan lampirkannya pada kiriman.
  "{service}を開きました。投稿画面にリザルト画像を貼り付けてください。": "{service} telah dibuka. Tampalkan imej keputusan pada kiriman."
  "{service}を開き、リザルト画像を保存しました。投稿画面で添付してください。": "{service} dibuka dan imej keputusan disimpan. Lampirkannya pada kiriman."
  投稿テンプレートをコピーしました。: Templat kiriman telah disalin.
  投稿テンプレートをコピーできませんでした。: Tidak dapat menyalin templat kiriman.
  SNS用リザルト画像: Imej keputusan untuk media sosial
  "{mode}のリザルト画像。ランク{rank}、{score}ポイント": "Imej keputusan {mode}: penarafan {rank}, {score} mata"
  文言をコピー: Salin teks
  各SNSの投稿画面にはテンプレート文を入力済みです。画像は貼り付け、未対応ブラウザでは保存して添付できます。: Templat kiriman tersedia dalam setiap aplikasi sosial. Tampalkan imej atau simpan dan lampirkan jika pelayar tidak menyokong perkongsian imej.
  pre-session tip: Petua sebelum sesi
  post-session tip: Petua selepas sesi
  本番モードは開始後の入力だけを採点します。: Sesi bertaraf hanya mengira input selepas bermula.
  本番モードは仮レーティング A0 以上で解放されます。: Mod penarafan dibuka apabila penarafan latihan mencapai A0 atau lebih tinggi.
  IMEあり本番では行を課題と一致させてから Enter で提出します。: Dalam mod penarafan dengan IME, padankan baris soalan kemudian tekan Enter untuk menghantar.
  500点未満は NR、500点以上は G0、以降は90点ごとにランクが上がります。: Skor bawah 500 ialah NR. G0 bermula pada 500 dan setiap tahap lebih tinggi memerlukan tambahan 90 mata.
  練習モードの仮レーティングは、本番モード解放の条件として使われます。: Penarafan latihan menentukan masa mod penarafan dibuka.
  次の課題プレビューは設定画面で表示方式と長さを変更できます。: Ubah gaya dan panjang pratonton soalan seterusnya dalam Tetapan.
  正確無比とIMEあり本番では、ミスをBackspaceで戻すまで先に進めません。: Dalam latihan Ketepatan dan mod penarafan IME, betulkan kesilapan dengan Backspace sebelum meneruskan.
  自動リタイアは、設定から有効にできます。: Anda boleh mengaktifkan tamat automatik dalam Tetapan.
  自分の「つまづきパターン」を理解するのが、成長に不可欠です。: Memahami corak kesilapan sendiri penting untuk maju.
  たいてい、他人より自分自身と競争するほうが良い結果が出ます。: Bersaing dengan diri sendiri selalunya memberikan hasil yang lebih baik.
  楽だからといって「エンジニア座り」をしていると、腰を壊すので気をつけましょう。: Duduk membongkok boleh membebankan belakang, jadi jaga postur.
  最高のパフォーマンスを出したいときは、まず机から離れ、爪の長さを確認するといいかも。: Untuk prestasi terbaik, berehat sebentar dari meja dan periksa panjang kuku.
  肩と手首の力を抜き、キーを押す力を必要最小限にすると次の入力が軽くなります。: Rehatkan bahu dan pergelangan tangan, tekan kekunci dengan daya yang perlu sahaja.
  焦るより、遅くても正確にやるほうがすべてのモードでスコアが伸びます。: Ketepatan meningkatkan skor dalam setiap mod walaupun anda menaip dengan lebih perlahan.
  1日に長時間練習しすぎないようにしましょう。腱鞘炎になります。: Jangan berlatih terlalu lama sehari untuk mengurangkan risiko ketegangan tendon.
  英文はだいぶ日本語文と感覚が違います。分けて練習しましょう。: Menaip bahasa Inggeris terasa berbeza daripada bahasa Jepun. Berlatih secara berasingan.
  一瞬一瞬のブーストよりも、安定してスラスラ打てるほうがスコアが伸びます。: Rentak yang stabil dan lancar meningkatkan skor lebih baik daripada pecutan sekali-sekala.
  単語で反射神経を競わず、長文で実力を磨くのがオススメ。: Tingkatkan kemahiran dengan petikan panjang, bukan berlumba menaip perkataan tunggal.
  文字をうったら、すぐにホームポジションに戻しましょう。: Kembalikan jari ke baris asas selepas setiap ketukan.
  打鍵中、手元を絶対に見てはいけません。絶対です。: Lihat skrin semasa menaip. Jangan jeling tangan.
  できるだけ、毎日練習しましょう。それが最短ルートです。: Berlatihlah setiap hari jika boleh. Itulah cara terpantas untuk maju.
  ずっと練習をするより、実用もするほうが伸びやすくなります。: Gabungkan latihan dengan menaip sebenar untuk maju lebih pantas.
  ミスしたキー単体よりも、ミスした組み合わせを見つける方が役に立つかも。: Mencari gabungan kekunci yang sering tersilap mungkin lebih berguna daripada satu kekunci.
  常に先読みを意識してみよう。: Cuba baca ke hadapan sambil menaip.
  高速化とは、文字を速く打つことではなく、迷う時間を減らすこと。: Menaip pantas bukan sekadar menggerakkan jari, tetapi juga mengurangkan masa teragak-agak.
  「ci」や「le」など、早く打てる別ルートも無理のない範囲で試してみよう。: Jika selesa, cuba corak input pantas seperti “ci” atau “le”.
