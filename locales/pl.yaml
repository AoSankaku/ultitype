{meta: {code: pl,name: Polski,direction: ltr},messages: {UltiType header: UltiType,Typing practice and rating: Ćwiczenia pisania i rankingi,ランクガイド: Przewodnik po rankingu,"ランクガイド（現在 {rank}）": "Przewodnik po rankingu (obecnie: {rank})",仮: Ćwiczenia,本: Ranking,ユーザー: Użytkownik,設定: Ustawienia,戻る: Wstecz,settings: ustawienia,theme: motyw,画面: Ekran,テーマ: Motyw,表示テーマを切り替える: Wybierz motyw kolorystyczny.,入力画面と入力方式: Ekran pisania i metody wprowadzania,練習画面のモックを見ながら入力方式と表示を調整する: "Dostosuj metody wprowadzania i wygląd, korzystając z podglądu ekranu ćwiczeń.",開く: Otwórz,サウンド: Dźwięk,タイプ音とUI/結果音の音量、カテゴリ別のON/OFFを調整します。: Ustaw głośność dźwięków pisania i interfejsu oraz włączaj i wyłączaj poszczególne kategorie.,音量: Głośność,タイプ音: Dźwięki pisania,UI/結果音: Dźwięki interfejsu i wyników,自動リタイア: Automatyczne kończenie sesji,無入力リタイア: Kończ przy braku aktywności,0 秒で無効: "Ustaw 0, aby wyłączyć",無入力リタイア秒数: Czas braku aktywności do zakończenia (sekundy),秒: s,秒数を調整: Dostosuj czas,1秒増やす: Dodaj 1 sekundę,1秒減らす: Odejmij 1 sekundę,連続誤打鍵リタイア: Kończ po serii błędów,0 打鍵で無効: "Ustaw 0, aby wyłączyć",連続誤打鍵数: Liczba kolejnych błędów,打鍵: uderzeń,正誤率ボーダー: Próg poprawności,0% で無効: "Ustaw 0%, aby wyłączyć",その他の設定: Pozostałe ustawienia,次の課題の表示文字数: Długość podglądu następnego zadania,短文練習モードで次に出る課題文の冒頭を表示する。0文字で非表示: "Pokaż początek następnego tekstu w krótkich ćwiczeniach. Ustaw 0, aby ukryć.",文字: znaków,次の課題の表示文字数を調整: Dostosuj długość podglądu,次の課題の表示文字数を増やす: Zwiększ długość podglądu,次の課題の表示文字数を減らす: Zmniejsz długość podglądu,危険な操作: Operacje usuwania danych,データと設定を消去: Usuń dane i ustawienia,ユーザーデータだけの削除、設定だけの初期化、またはその両方を選ぶ: "Wybierz, czy usunąć dane użytkownika, zresetować ustawienia, czy zrobić obie rzeczy.",ユーザーデータ: Dane użytkownika,設定を初期化: Resetuj ustawienia,両方: Obie opcje,スコアと履歴だけを削除します。設定は残します。よろしいですか？: "Usunąć wyniki i historię, zachowując ustawienia?",設定をすべて初期値に戻します。スコアと履歴は残します。よろしいですか？: "Zresetować wszystkie ustawienia, zachowując wyniki i historię?",スコア、履歴、設定をすべて削除します。よろしいですか？: "Usunąć wszystkie wyniki, historię i ustawienia?",アプリの表示言語: Język aplikacji,画面に表示する言語を選択します。練習する言語はモード選択画面で変更できます。: Wybierz język interfejsu. Język ćwiczeń zmienisz na ekranie wyboru trybu.,日本語: Japoński,English: Angielski,ダーク: Ciemny,ライト: Jasny,この画面幅はサポート対象外です: Ta szerokość ekranu nie jest obsługiwana,UltiType は 520px 以上のデスクトップ画面向けです。現在の表示ではデスクトップ向けレイアウトを維持します。: UltiType jest przeznaczony na ekrany komputerów o szerokości co najmniej 520 px. Wyświetlany jest układ desktopowy.,以後表示しない: Nie pokazuj ponownie,警告を閉じる: Zamknij ostrzeżenie,ランク到達状況: Postępy rankingu,スコア計算式: Wzór obliczania wyniku,基本のスコア計算式: Podstawowy wzór wyniku,打鍵/秒 × 1000 × 正確率^モード係数 × 補正: Uderzenia/s × 1000 × dokładność^współczynnik trybu × mnożnik,正確率は正しく入力した文字数 ÷ 入力を試みた文字数です。均等モードのみ、打鍵間隔の安定度が補正として加わります。: Dokładność to liczba poprawnie wpisanych znaków podzielona przez liczbę prób. Tylko tryb Płynność mnoży wynik przez stabilność rytmu pisania.,正確率係数: Współczynnik dokładności,補正: Mnożnik,安定度: Stabilność,なし: Brak,現在ランク: Obecny ranking,最高スコア: Najlepszy wynik,次の目標: Następny cel,ランク帯: Poziom,基準スコア: Wymagany wynik,到達状況: Stan,達成: Osiągnięto,"あと {score}": "Pozostało {score}",ランクなし: Bez rankingu,"{title} ランク": "Poziomy: {title}",灰: Szary,薄緑: Jasnozielony,薄青: Jasnoniebieski,緑: Zielony,青: Niebieski,橙: Pomarańczowy,赤: Czerwony,金: Złoty,紫: Fioletowy,黒紫: Ciemny fiolet,黒: Czarny,虹: Tęcza,ローカルユーザー: Użytkownik lokalny,Keybase連携は未設定です。: Połączenie z Keybase nie jest skonfigurowane.,ユーザー概要: Podsumowanie użytkownika,仮ランク: Ranga treningowa,本番ランク: Ranga oficjalna,まだ保存されたセッションはありません。: Brak zapisanych sesji.,Recent Sessions: Ostatnie sesje,ランク: Ranga,500点未満はランクなし、500点から G0 が始まり、基準スコアはランクごとに90点ずつ上がります。: "Poniżej 500 punktów nie ma rangi. G0 zaczyna się od 500, a próg każdej kolejnej rangi rośnie o 90 punktów.",入力待ち: Oczekiwanie na wpisywanie,課題終了まで非表示: Ukryte do końca tekstu,正誤率: Poprawność,"ミス {count}": "Błędy: {count}",正誤履歴: Historia poprawnych i błędnych odpowiedzi,平均打鍵間隔: Średni odstęp między naciśnięciami,ズレ平均: Średnie odchylenie,物理打鍵: Fizyczne naciśnięcia klawiszy,打鍵間隔の安定度グラフ: Wykres stabilności rytmu pisania,"あと {count} 回": "Pozostało: {count}",残り時間: Pozostały czas,残り時間（％）: Pozostały czas (%),打鍵/秒: Naciśnięcia/s,打鍵/分: Naciśnięcia/min,かな文字/秒: Znaki kana/s,課題文字/秒: Znaki tekstu/s,正確率: Poprawność,ミス数: Liczba błędów,完了課題: Ukończone teksty,ミス/物理打鍵: Błędy/naciśnięcia klawiszy,正解/物理打鍵: Poprawne odpowiedzi/naciśnięcia klawiszy,開始: Rozpocznij,修正: Korekta,正打: Poprawnie,ミス: Błąd,モード選択: Wybierz tryb,リセット: Resetuj,無入力が続いたためリタイアしました: Sesja zakończona z powodu długiego braku aktywności,"セッション終了: {rank} / {score}": "Sesja zakończona: {rank} / {score}",開始ボタン、またはここで入力を始める: Naciśnij Start lub zacznij tutaj pisać,IMEありで入力し、行が一致したら Enter: "Pisz z użyciem IME i naciśnij Enter, gdy wiersz będzie zgodny",英文を入力し、行が一致したら Enter: "Wpisz angielski wiersz i naciśnij Enter, gdy będzie zgodny",typing input: Pole do pisania,direct keyboard capture: Bezpośrednie przechwytywanie klawiatury,resize typing input: Zmień rozmiar pola do pisania,Rank hidden for the first 30 seconds: Ranga ukryta przez pierwsze 30 sekund,タイピング: Pisanie,速度だけじゃない。精度と安定性まで、次の一打へ。: Liczy się nie tylko szybkość. Każde kolejne naciśnięcie to precyzja i stabilność.,速さだけじゃない。精度と安定性まで、次の一打へ。: Nie tylko szybkość. Każde kolejne naciśnięcie to precyzja i stabilność.,Tips: Wskazówki,typing practice: Ćwiczenie pisania,Live Analysis: Analiza na żywo,"{key} / {interval} / {state}": "{key} / {interval} / {state}",画像を準備できませんでした。もう一度お試しください。: Nie udało się przygotować obrazu. Spróbuj ponownie.,共有メニューにリザルト画像を送りました。: Obraz wyniku wysłano do menu udostępniania.,共有を完了できませんでした。画像保存をお試しください。: Nie udało się udostępnić. Spróbuj zapisać obraz.,Share APIが使えないため、画像を保存して投稿文をコピーしました。: "API udostępniania jest niedostępne, więc obraz zapisano, a tekst posta skopiowano.","{service}を開きます。画像はPNG保存から添付してください。": "Otwieranie {service}. Zapisz PNG i załącz go do posta.","{service}を開きました。投稿画面にリザルト画像を貼り付けてください。": "Otwarto {service}. Dodaj obraz wyniku do posta.","{service}を開き、リザルト画像を保存しました。投稿画面で添付してください。": "Otwarto {service} i zapisano obraz wyniku. Załącz go na ekranie tworzenia posta.",投稿テンプレートをコピーしました。: Skopiowano szablon posta.,投稿テンプレートをコピーできませんでした。: Nie udało się skopiować szablonu posta.,SNS用リザルト画像: Obraz wyniku do mediów społecznościowych,"{mode}のリザルト画像。ランク{rank}、{score}ポイント": "Obraz wyniku ({mode}): ranga {rank}, {score} pkt",文言をコピー: Kopiuj tekst,各SNSの投稿画面にはテンプレート文を入力済みです。画像は貼り付け、未対応ブラウザでは保存して添付できます。: "Szablon posta jest już wpisany na ekranie publikacji każdej sieci. Wklej obraz albo zapisz go i załącz, jeśli przeglądarka nie obsługuje udostępniania.",pre-session tip: Wskazówka przed sesją,post-session tip: Wskazówka po sesji,本番モードは開始後の入力だけを採点します。: W trybie oficjalnym punktowane jest tylko pisanie rozpoczęte po starcie.,本番モードは仮レーティング A0 以上で解放されます。: Tryby oficjalne odblokowują się po osiągnięciu rangi treningowej A0 lub wyższej.,IMEあり本番では行を課題と一致させてから Enter で提出します。: "W trybie oficjalnym z IME dopasuj wiersz do tekstu i naciśnij Enter, aby go wysłać.",500点未満は NR、500点以上は G0、以降は90点ごとにランクが上がります。: "Poniżej 500 pkt jest NR, od 500 pkt G0, a ranga rośnie co 90 pkt.",練習モードの仮レーティングは、本番モード解放の条件として使われます。: Ranga treningowa decyduje o odblokowaniu trybów oficjalnych.,次の課題プレビューは設定画面で表示方式と長さを変更できます。: Sposób wyświetlania i długość podglądu następnego tekstu zmienisz w ustawieniach.,正確無比とIMEあり本番では、ミスをBackspaceで戻すまで先に進めません。: "W trybie dokładności i oficjalnym z IME nie przejdziesz dalej, dopóki nie poprawisz błędu klawiszem Backspace.",自動リタイアは、設定から有効にできます。: Automatyczne rezygnowanie możesz włączyć w ustawieniach.,自分の「つまづきパターン」を理解するのが、成長に不可欠です。: Zrozumienie własnych wzorców błędów jest kluczowe dla postępów.,たいてい、他人より自分自身と競争するほうが良い結果が出ます。: "Często osiąga się lepsze wyniki, rywalizując z samym sobą zamiast z innymi.",楽だからといって「エンジニア座り」をしていると、腰を壊すので気をつけましょう。: "Wygodna pozycja zgarbiona może zaszkodzić plecom, więc pilnuj postawy.",最高のパフォーマンスを出したいときは、まず机から離れ、爪の長さを確認するといいかも。: "Aby osiągnąć najlepsze wyniki, odejdź na chwilę od biurka i sprawdź długość paznokci.",肩と手首の力を抜き、キーを押す力を必要最小限にすると次の入力が軽くなります。: "Rozluźnij barki i nadgarstki, a klawisze naciskaj z minimalną potrzebną siłą — kolejne wpisywanie będzie lżejsze.",焦るより、遅くても正確にやるほうがすべてのモードでスコアが伸びます。: "Dokładność poprawia wynik w każdym trybie, nawet jeśli piszesz wolniej.",1日に長時間練習しすぎないようにしましょう。腱鞘炎になります。: "Nie ćwicz zbyt długo jednego dnia, aby uniknąć przeciążenia ścięgien.",英文はだいぶ日本語文と感覚が違います。分けて練習しましょう。: Pisanie po angielsku różni się od pisania po japońsku. Ćwicz te języki osobno.,一瞬一瞬のブーストよりも、安定してスラスラ打てるほうがスコアが伸びます。: "Równy, płynny rytm poprawia wynik bardziej niż sporadyczne zrywy szybkości.",単語で反射神経を競わず、長文で実力を磨くのがオススメ。: "Rozwijaj umiejętności na dłuższych tekstach, zamiast ścigać się na pojedynczych słowach.",文字をうったら、すぐにホームポジションに戻しましょう。: Po wpisaniu znaku od razu wróć palcami do rzędu podstawowego.,打鍵中、手元を絶対に見てはいけません。絶対です。: Podczas pisania nigdy nie patrz na dłonie. Ani razu.,できるだけ、毎日練習しましょう。それが最短ルートです。: "Ćwicz codziennie, jeśli możesz. To najszybsza droga do postępów.",ずっと練習をするより、実用もするほうが伸びやすくなります。: "Łącz ćwiczenia z pisaniem w praktyce, aby szybciej robić postępy.",ミスしたキー単体よりも、ミスした組み合わせを見つける方が役に立つかも。: "Warto znaleźć kombinacje klawiszy, na których popełniasz błędy, zamiast skupiać się na jednym klawiszu.",常に先読みを意識してみよう。: Podczas pisania staraj się czytać z wyprzedzeniem.,高速化とは、文字を速く打つことではなく、迷う時間を減らすこと。: Szybsze pisanie polega bardziej na ograniczaniu wahania niż na szybszym poruszaniu palcami.,「ci」や「le」など、早く打てる別ルートも無理のない範囲で試してみよう。: "Jeśli jest ci wygodnie, wypróbuj szybsze alternatywne zapisy, takie jak „ci” lub „le”.",入力画面設定: Ustawienia ekranu pisania,画面設定: Ustawienia ekranu,入力画面のプレビュー: Podgląd ekranu pisania,一時停止: Wstrzymaj,10.0打鍵/秒プレビュー: "Podgląd: 10,0 naciśnięć/s",5.0打鍵/秒プレビュー: "Podgląd: 5,0 naciśnięć/s",プレビューの課題文: Podgląd tekstu,短文: Krótki tekst,長文: Długi tekst,入力画面: Ekran pisania,フォント: Czcionki,表示順: Kolejność wyświetlania,漢字・ふりがな・ひらがな表示に使うGoogle Fonts: "Czcionki Google używane do wyświetlania kanji, furigany i hiragany",日本語フォント: Czcionka japońska,ローマ字・英語課題文に使うGoogle Fonts: 