  各SNSの投稿画面にはテンプレート文を入力済みです。画像は貼り付け、未対応ブラウザでは保存して添付できます。: O modelo de texto já está preenchido nas telas de publicação das redes. Cole a imagem ou, se o navegador não permitir, salve e anexe.
  pre-session tip: Dica antes da sessão
  post-session tip: Dica depois da sessão
  本番モードは開始後の入力だけを採点します。: O modo competitivo contabiliza apenas as digitações feitas após o início.
  本番モードは仮レーティング A0 以上で解放されます。: O modo competitivo é desbloqueado com classificação provisória A0 ou superior.
  IMEあり本番では行を課題と一致させてから Enter で提出します。: No modo competitivo com IME, faça a linha corresponder ao texto e pressione Enter para enviar.
  500点未満は NR、500点以上は G0、以降は90点ごとにランクが上がります。: "Abaixo de 500 pontos: sem classificação; G0 começa em 500; cada nível sobe 90 pontos."
  練習モードの仮レーティングは、本番モード解放の条件として使われます。: A classificação provisória do treino é usada para desbloquear o modo competitivo.
  次の課題プレビューは設定画面で表示方式と長さを変更できます。: Altere nas configurações o estilo e o tamanho da prévia do próximo texto.
  正確無比とIMEあり本番では、ミスをBackspaceで戻すまで先に進めません。: Nos modos Precisão e Competitivo com IME, corrija os erros com Backspace antes de continuar.
  自動リタイアは、設定から有効にできます。: Ative o encerramento automático nas configurações.
  自分の「つまづきパターン」を理解するのが、成長に不可欠です。: Entender os próprios padrões de erro é essencial para melhorar.
  たいてい、他人より自分自身と競争するほうが良い結果が出ます。: Geralmente, competir consigo mesmo dá resultados melhores do que competir com outras pessoas.
  楽だからといって「エンジニア座り」をしていると、腰を壊すので気をつけましょう。: Mesmo que pareça confortável, sentar curvado à mesa pode prejudicar as costas.
  最高のパフォーマンスを出したいときは、まず机から離れ、爪の長さを確認するといいかも。: Para render melhor, afaste-se da mesa por um instante e confira o tamanho das unhas.
  肩と手首の力を抜き、キーを押す力を必要最小限にすると次の入力が軽くなります。: Relaxe os ombros e os pulsos. Use só a força necessária para pressionar cada tecla.
  焦るより、遅くても正確にやるほうがすべてのモードでスコアが伸びます。: Em todos os modos, a precisão aumenta a pontuação mais do que digitar rápido com erros.
  1日に長時間練習しすぎないようにしましょう。腱鞘炎になります。: Evite treinar por muitas horas no mesmo dia para reduzir o risco de tendinite.
  英文はだいぶ日本語文と感覚が違います。分けて練習しましょう。: Digitar em inglês é bem diferente de digitar em japonês. Treine cada idioma separadamente.
  一瞬一瞬のブーストよりも、安定してスラスラ打てるほうがスコアが伸びます。: Um ritmo constante melhora mais a pontuação do que breves arrancadas de velocidade.
  単語で反射神経を競わず、長文で実力を磨くのがオススメ。: Pratique com textos longos em vez de competir pela rapidez com palavras isoladas.
  文字をうったら、すぐにホームポジションに戻しましょう。: Volte à posição inicial das mãos depois de cada tecla.
  打鍵中、手元を絶対に見てはいけません。絶対です。: Não olhe para as mãos enquanto digita. É sério.
  できるだけ、毎日練習しましょう。それが最短ルートです。: Se puder, treine todos os dias. Esse é o caminho mais curto para melhorar.
  ずっと練習をするより、実用もするほうが伸びやすくなります。: Alternar o treino com a digitação do dia a dia ajuda a progredir.
  ミスしたキー単体よりも、ミスした組み合わせを見つける方が役に立つかも。: Pode ser mais útil descobrir combinações que causam erros do que se concentrar em uma única tecla.
  常に先読みを意識してみよう。: Tente ler algumas palavras adiante enquanto digita.
  高速化とは、文字を速く打つことではなく、迷う時間を減らすこと。: Digitar mais rápido tem menos a ver com mover os dedos e mais com hesitar menos.
  「ci」や「le」など、早く打てる別ルートも無理のない範囲で試してみよう。: Experimente outras sequências rápidas, como “ci” ou “le”, se forem confortáveis.
