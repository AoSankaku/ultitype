  各SNSの投稿画面にはテンプレート文を入力済みです。画像は貼り付け、未対応ブラウザでは保存して添付できます。: O modelo já está preenchido nas páginas de publicação das redes. Cole a imagem ou, se o navegador não permitir, guarde-a e anexe-a.
  pre-session tip: Dica antes da sessão
  post-session tip: Dica depois da sessão
  本番モードは開始後の入力だけを採点します。: O modo de competição só contabiliza as introduções feitas depois de iniciar.
  本番モードは仮レーティング A0 以上で解放されます。: O modo de competição desbloqueia-se com uma classificação provisória A0 ou superior.
  IMEあり本番では行を課題と一致させてから Enter で提出します。: Na competição com IME, faça coincidir a linha com o texto e prima Enter para a submeter.
  500点未満は NR、500点以上は G0、以降は90点ごとにランクが上がります。: "Abaixo de 500 pontos: sem classificação; G0 começa nos 500; cada nível aumenta 90 pontos."
  練習モードの仮レーティングは、本番モード解放の条件として使われます。: A classificação provisória do treino é usada para desbloquear o modo de competição.
  次の課題プレビューは設定画面で表示方式と長さを変更できます。: Nas definições, altere o formato e o comprimento da pré-visualização do texto seguinte.
  正確無比とIMEあり本番では、ミスをBackspaceで戻すまで先に進めません。: Nos modos Precisão e Competição com IME, corrija os erros com Backspace antes de continuar.
  自動リタイアは、設定から有効にできます。: Ative o término automático nas definições.
  自分の「つまづきパターン」を理解するのが、成長に不可欠です。: Compreender os seus padrões de erro é essencial para melhorar.
  たいてい、他人より自分自身と競争するほうが良い結果が出ます。: Normalmente, competir consigo próprio traz melhores resultados do que competir com os outros.
  楽だからといって「エンジニア座り」をしていると、腰を壊すので気をつけましょう。: Mesmo que pareça confortável, sentar-se curvado à secretária pode prejudicar as costas.
  最高のパフォーマンスを出したいときは、まず机から離れ、爪の長さを確認するといいかも。: Para melhorar o desempenho, afaste-se um instante da secretária e veja se as unhas não estão compridas.
  肩と手首の力を抜き、キーを押す力を必要最小限にすると次の入力が軽くなります。: Relaxe os ombros e os pulsos. Prima cada tecla só com a força necessária.
  焦るより、遅くても正確にやるほうがすべてのモードでスコアが伸びます。: Em todos os modos, a precisão melhora a pontuação mais do que escrever depressa com erros.
  1日に長時間練習しすぎないようにしましょう。腱鞘炎になります。: Evite treinar durante muitas horas por dia para reduzir o risco de tendinite.
  英文はだいぶ日本語文と感覚が違います。分けて練習しましょう。: Escrever em inglês é bastante diferente de escrever em japonês. Treine cada língua em separado.
  一瞬一瞬のブーストよりも、安定してスラスラ打てるほうがスコアが伸びます。: Um ritmo regular melhora a pontuação mais do que breves acelerações.
  単語で反射神経を競わず、長文で実力を磨くのがオススメ。: Treine com textos longos em vez de competir pela rapidez com palavras isoladas.
  文字をうったら、すぐにホームポジションに戻しましょう。: Regresse à posição inicial das mãos depois de cada tecla.
  打鍵中、手元を絶対に見てはいけません。絶対です。: Não olhe para as mãos enquanto escreve. Mesmo.
  できるだけ、毎日練習しましょう。それが最短ルートです。: Treine todos os dias, se puder. É o caminho mais curto para melhorar.
  ずっと練習をするより、実用もするほうが伸びやすくなります。: Alternar entre treino e escrita do dia a dia ajuda a progredir.
  ミスしたキー単体よりも、ミスした組み合わせを見つける方が役に立つかも。: Pode ser mais útil encontrar combinações que causam erros do que se focar numa única tecla.
  常に先読みを意識してみよう。: Tente ler algumas palavras à frente enquanto escreve.
  高速化とは、文字を速く打つことではなく、迷う時間を減らすこと。: Escrever mais depressa tem menos que ver com mover os dedos e mais com hesitar menos.
  「ci」や「le」など、早く打てる別ルートも無理のない範囲で試してみよう。: Experimente sequências alternativas mais rápidas, como «ci» ou «le», se forem confortáveis.
