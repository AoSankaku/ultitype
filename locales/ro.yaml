  画像を準備できませんでした。もう一度お試しください。: Imaginea nu a putut fi pregătită. Încearcă din nou.
  共有メニューにリザルト画像を送りました。: Imaginea rezultatului a fost trimisă în meniul de distribuire.
  共有を完了できませんでした。画像保存をお試しください。: Distribuirea nu a reușit. Încearcă să salvezi imaginea.
  Share APIが使えないため、画像を保存して投稿文をコピーしました。: API-ul de distribuire nu este disponibil; imaginea a fost salvată și textul postării a fost copiat.
  "{service}を開きます。画像はPNG保存から添付してください。": Se deschide {service}. Salvează imaginea PNG și atașeaz-o postării.
  "{service}を開きました。投稿画面にリザルト画像を貼り付けてください。": "{service} s-a deschis. Lipește imaginea rezultatului în postare."
  "{service}を開き、リザルト画像を保存しました。投稿画面で添付してください。": "{service} s-a deschis și imaginea rezultatului a fost salvată. Atașeaz-o postării."
  投稿テンプレートをコピーしました。: Șablonul postării a fost copiat.
  投稿テンプレートをコピーできませんでした。: Șablonul postării nu a putut fi copiat.
