  文言をコピー: Copiază textul
  各SNSの投稿画面にはテンプレート文を入力済みです。画像は貼り付け、未対応ブラウザでは保存して添付できます。: Șablonul textului este deja completat în ferestrele de publicare. Lipește imaginea sau, în browserele incompatibile, salveaz-o și atașeaz-o.
  pre-session tip: Sfat înaintea sesiunii
  post-session tip: Sfat după sesiune
  本番モードは開始後の入力だけを採点します。: Modul competitiv punctează doar tastarea după pornire.
  本番モードは仮レーティング A0 以上で解放されます。: Modul competitiv se deblochează la un rang provizoriu A0 sau superior.
  IMEあり本番では行を課題と一致させてから Enter で提出します。: În competiția cu IME, potrivește linia cu textul și apasă Enter pentru trimitere.
  500点未満は NR、500点以上は G0、以降は90点ごとにランクが上がります。: "Sub 500 de puncte: fără rang; G0 începe la 500, apoi rangul crește la fiecare 90 de puncte."
  練習モードの仮レーティングは、本番モード解放の条件として使われます。: Rangul provizoriu de exercițiu este folosit pentru deblocarea modului competitiv.
  次の課題プレビューは設定画面で表示方式と長さを変更できます。: Modifică afișarea și lungimea previzualizării următorului text din setări.
  正確無比とIMEあり本番では、ミスをBackspaceで戻すまで先に進めません。: În modul Precizie și în competiția cu IME, corectează greșelile cu Backspace înainte de a continua.
  自動リタイアは、設定から有効にできます。: Activează retragerea automată din setări.
  自分の「つまづきパターン」を理解するのが、成長に不可欠です。: Înțelegerea propriilor tipare de greșeli este esențială pentru progres.
  たいてい、他人より自分自身と競争するほうが良い結果が出ます。: De obicei, te ajută mai mult să concurezi cu tine însuți decât cu alții.
  楽だからといって「エンジニア座り」をしていると、腰を壊すので気をつけましょう。: Chiar dacă pare comod, postura aplecată la birou îți poate afecta spatele.
  最高のパフォーマンスを出したいときは、まず机から離れ、爪の長さを確認するといいかも。: Pentru performanță maximă, îndepărtează-te puțin de birou și verifică lungimea unghiilor.
  肩と手首の力を抜き、キーを押す力を必要最小限にすると次の入力が軽くなります。: Relaxează umerii și încheieturile. Apasă tastele cu forța minimă necesară.
  焦るより、遅くても正確にやるほうがすべてのモードでスコアが伸びます。: În toate modurile, acuratețea crește scorul mai mult decât tastarea rapidă cu greșeli.
  1日に長時間練習しすぎないようにしましょう。腱鞘炎になります。: Evită să exersezi prea multe ore pe zi pentru a reduce riscul de tendinită.
  英文はだいぶ日本語文と感覚が違います。分けて練習しましょう。: Tastarea în engleză se simte diferit de cea în japoneză. Exersează separat fiecare limbă.
  一瞬一瞬のブーストよりも、安定してスラスラ打てるほうがスコアが伸びます。: Un ritm constant îmbunătățește scorul mai mult decât impulsurile scurte de viteză.
  単語で反射神経を競わず、長文で実力を磨くのがオススメ。: Dezvoltă-ți abilitățile cu texte lungi, nu concurând la viteză pe cuvinte izolate.
  文字をうったら、すぐにホームポジションに戻しましょう。: Readu mâinile la poziția de bază după fiecare apăsare.
  打鍵中、手元を絶対に見てはいけません。絶対です。: Nu te uita la mâini în timp ce tastezi. Serios.
  できるだけ、毎日練習しましょう。それが最短ルートです。: Exersează zilnic când poți. Este cea mai scurtă cale spre progres.
  ずっと練習をするより、実用もするほうが伸びやすくなります。: Alternarea exercițiului cu tastarea de zi cu zi te ajută să progresezi.
  ミスしたキー単体よりも、ミスした組み合わせを見つける方が役に立つかも。: Poate fi mai util să identifici combinațiile care provoacă greșeli decât să te concentrezi pe o singură tastă.
  常に先読みを意識してみよう。: Încearcă să citești înainte câteva cuvinte în timp ce tastezi.
  高速化とは、文字を速く打つことではなく、迷う時間を減らすこと。: Tastarea mai rapidă înseamnă mai puțină ezitare, nu doar degete mai rapide.
  「ci」や「le」など、早く打てる別ルートも無理のない範囲で試してみよう。: Încearcă variante rapide precum „ci” sau „le” dacă ți se par comode.
