{meta: {code: ru,name: Русский,direction: ltr},messages: {UltiType header: UltiType,Typing practice and rating: Тренировка печати и рейтинг,ランクガイド: Руководство по рейтингам,"ランクガイド（現在 {rank}）": "Руководство по рейтингам (текущий: {rank})",仮: Тренировка,本: Рейтинг,ユーザー: Пользователь,設定: Настройки,戻る: Назад,settings: настройки,theme: тема,画面: Экран,テーマ: Тема,表示テーマを切り替える: Выберите цветовую тему.,入力画面と入力方式: Экран набора текста и способы ввода,練習画面のモックを見ながら入力方式と表示を調整する: Настройте способы ввода и отображение с помощью предварительного просмотра экрана тренировки.,開く: Открыть,サウンド: Звук,タイプ音とUI/結果音の音量、カテゴリ別のON/OFFを調整します。: "Настройте громкость звуков печати и интерфейса, а также включение каждой категории.",音量: Громкость,タイプ音: Звук клавиш,UI/結果音: Звуки интерфейса и результатов,自動リタイア: Автоматическое завершение сессии,無入力リタイア: Завершать при бездействии,0 秒で無効: 0 — выключено,無入力リタイア秒数: Время до завершения при бездействии (секунды),秒: с,秒数を調整: Изменить время,1秒増やす: Добавить 1 секунду,1秒減らす: Убрать 1 секунду,連続誤打鍵リタイア: Завершать после ошибок подряд,0 打鍵で無効: 0 — выключено,連続誤打鍵数: Число ошибок подряд,打鍵: нажатий,正誤率ボーダー: Порог точности,0% で無効: 0% — выключено,その他の設定: Другие настройки,次の課題の表示文字数: Длина предпросмотра следующего задания,短文練習モードで次に出る課題文の冒頭を表示する。0文字で非表示: "Показывать начало следующего задания в короткой тренировке. Установите 0, чтобы скрыть.",文字: симв.,次の課題の表示文字数を調整: Настроить длину предпросмотра,次の課題の表示文字数を増やす: Увеличить длину предпросмотра,次の課題の表示文字数を減らす: Уменьшить длину предпросмотра,危険な操作: Удаление данных,データと設定を消去: Удалить данные и настройки,ユーザーデータだけの削除、設定だけの初期化、またはその両方を選ぶ: "Выберите, что удалить: пользовательские данные, настройки или и то и другое.",ユーザーデータ: Данные пользователя,設定を初期化: Сбросить настройки,両方: Оба варианта,スコアと履歴だけを削除します。設定は残します。よろしいですか？: "Удалить результаты и историю, сохранив настройки?",設定をすべて初期値に戻します。スコアと履歴は残します。よろしいですか？: "Сбросить все настройки, сохранив результаты и историю?",スコア、履歴、設定をすべて削除します。よろしいですか？: "Удалить все результаты, историю и настройки?",アプリの表示言語: Язык приложения,画面に表示する言語を選択します。練習する言語はモード選択画面で変更できます。: Выберите язык интерфейса. Язык тренировки можно сменить на экране выбора режима.,日本語: Японский,English: Английский,ダーク: Тёмная,ライト: Светлая,この画面幅はサポート対象外です: Эта ширина экрана не поддерживается,UltiType は 520px 以上のデスクトップ画面向けです。現在の表示ではデスクトップ向けレイアウトを維持します。: UltiType предназначен для настольных экранов шириной от 520 пикселей. Сейчас показана настольная версия.,以後表示しない: Больше не показывать,警告を閉じる: Закрыть предупреждение,ランク到達状況: Прогресс рейтинга,スコア計算式: Формула расчёта очков,基本のスコア計算式: Базовая формула расчёта очков,打鍵/秒 × 1000 × 正確率^モード係数 × 補正: Нажатий в секунду × 1000 × точность^коэффициент режима × множитель,正確率は正しく入力した文字数 ÷ 入力を試みた文字数です。均等モードのみ、打鍵間隔の安定度が補正として加わります。: "Точность — это число верно введённых символов, делённое на число попыток. Только режим «Плавно» умножает очки на стабильность ритма набора.",正確率係数: Коэффициент точности,補正: Множитель,安定度: Стабильность,なし: Нет,現在ランク: Текущий рейтинг,最高スコア: Лучший результат,次の目標: Следующая цель,ランク帯: Уровень,基準スコア: Необходимый результат,到達状況: Состояние,達成: Достигнуто,"あと {score}": "Осталось {score}",ランクなし: Без рейтинга,"{title} ランク": "Уровни: {title}",灰: Серый,薄緑: Светло-зелёный,薄青: Светло-синий,緑: Зелёный,青: Синий,橙: Оранжевый,赤: Красный,金: Золотой,紫: Фиолетовый,黒紫: Тёмно-фиолетовый,黒: Чёрный,虹: Радуга,ローカルユーザー: Локальный пользователь,Keybase連携は未設定です。: Привязка Keybase не настроена.,ユーザー概要: Сведения о пользователе,仮ランク: Пробный рейтинг,本番ランク: Рейтинг в соревновательном режиме,まだ保存されたセッションはありません。: Пока нет сохранённых сессий.,Recent Sessions: Недавние сессии,ランク: Ранг,500点未満はランクなし、500点から G0 が始まり、基準スコアはランクごとに90点ずつ上がります。: "Результат ниже 500 не имеет ранга. G0 начинается с 500, а порог каждого следующего ранга повышается на 90 баллов.",入力待ち: Ожидание ввода,課題終了まで非表示: Скрыто до завершения задания,正誤率: Точность,"ミス {count}": "Ошибок: {count}",正誤履歴: История правильных и ошибочных ответов,平均打鍵間隔: Средний интервал между нажатиями,ズレ平均: Среднее отклонение,物理打鍵: Физические нажатия клавиш,打鍵間隔の安定度グラフ: График стабильности ритма печати,"あと {count} 回": "Осталось: {count}",残り時間: Оставшееся время,残り時間（％）: Оставшееся время (%),打鍵/秒: Нажатий/с,打鍵/分: Нажатий/мин,かな文字/秒: Символов каны/с,課題文字/秒: Символов задания/с,正確率: Точность,ミス数: Количество ошибок,完了課題: Завершённые задания,ミス/物理打鍵: Ошибки/физические нажатия,正解/物理打鍵: Верные ответы/физические нажатия,開始: Начать,修正: Исправление,正打: Верно,ミス: Ошибка,モード選択: Выбрать режим,リセット: Сбросить,無入力が続いたためリタイアしました: Сессия завершена из-за долгого отсутствия ввода,"セッション終了: {rank} / {score}": "Сессия завершена: {rank} / {score}",開始ボタン、またはここで入力を始める: Нажмите «Начать» или начните печатать здесь,IMEありで入力し、行が一致したら Enter: "Введите текст с IME и нажмите Enter, когда строка совпадёт",英文を入力し、行が一致したら Enter: "Введите английскую строку и нажмите Enter, когда она совпадёт",typing input: Поле ввода текста,direct keyboard capture: Прямой перехват ввода с клавиатуры,resize typing input: Изменить размер поля ввода,Rank hidden for the first 30 seconds: Ранг скрыт первые 30 секунд,タイピング: Печать,速度だけじゃない。精度と安定性まで、次の一打へ。: Не только скорость. Точность и стабильность в каждом следующем нажатии.,速さだけじゃない。精度と安定性まで、次の一打へ。: Не только быстрота. Точность и стабильность в каждом следующем нажатии.,Tips: Советы,typing practice: Практика печати,Live Analysis: Анализ в реальном времени,"{key} / {interval} / {state}": "{key} / {interval} / {state}",画像を準備できませんでした。もう一度お試しください。: Не удалось подготовить изображение. Попробуйте ещё раз.,共有メニューにリザルト画像を送りました。: Изображение результата отправлено в меню «Поделиться».,共有を完了できませんでした。画像保存をお試しください。: Не удалось поделиться. Попробуйте сохранить изображение.,Share APIが使えないため、画像を保存して投稿文をコピーしました。: "API публикации недоступен, поэтому изображение сохранено, а текст публикации скопирован.","{service}を開きます。画像はPNG保存から添付してください。": "Открываем {service}. Сохраните PNG и прикрепите его к публикации.","{service}を開きました。投稿画面にリザルト画像を貼り付けてください。": "Открыт {service}. Вставьте изображение результата в публикацию.","{service}を開き、リザルト画像を保存しました。投稿画面で添付してください。": "Открыт {service}, изображение результата сохранено. Прикрепите его на экране публикации.",投稿テンプレートをコピーしました。: Шаблон публикации скопирован.,投稿テンプレートをコピーできませんでした。: Не удалось скопировать шаблон публикации.,SNS用リザルト画像: Изображение результата для соцсетей,"{mode}のリザルト画像。ランク{rank}、{score}ポイント": "Изображение результата в режиме «{mode}»: ранг {rank}, {score} очков",文言をコピー: Скопировать текст,各SNSの投稿画面にはテンプレート文を入力済みです。画像は貼り付け、未対応ブラウザでは保存して添付できます。: Текст шаблона уже добавлен в форму публикации каждой соцсети. Вставьте изображение; в неподдерживаемом браузере сохраните его и прикрепите.,pre-session tip: Совет перед сессией,post-session tip: Совет после сессии,本番モードは開始後の入力だけを採点します。: В рейтинговом режиме учитывается только ввод после начала сессии.,本番モードは仮レーティング A0 以上で解放されます。: Рейтинговые режимы открываются при пробном рейтинге A0 или выше.,IMEあり本番では行を課題と一致させてから Enter で提出します。: В рейтинговом режиме с IME дождитесь совпадения строки с заданием и нажмите Enter для отправки.,500点未満は NR、500点以上は G0、以降は90点ごとにランクが上がります。: "Ниже 500 очков — NR, от 500 — G0; каждые следующие 90 очков повышают ранг.",練習モードの仮レーティングは、本番モード解放の条件として使われます。: Пробный рейтинг в тренировочном режиме определяет доступ к рейтинговым режимам.,次の課題プレビューは設定画面で表示方式と長さを変更できます。: Способ отображения и длину следующего задания можно изменить в настройках.,正確無比とIMEあり本番では、ミスをBackspaceで戻すまで先に進めません。: "В режиме «Точность» и рейтинговом режиме с IME нельзя продолжить, пока не исправите ошибку клавишей Backspace.",自動リタイアは、設定から有効にできます。: Автоматический выход можно включить в настройках.,自分の「つまづきパターン」を理解するのが、成長に不可欠です。: "Чтобы расти, важно понимать собственные типичные ошибки.",たいてい、他人より自分自身と競争するほうが良い結果が出ます。: "Часто лучше соревноваться с собой, а не с другими.",楽だからといって「エンジニア座り」をしていると、腰を壊すので気をつけましょう。: "Даже если так удобнее, не сутультесь за компьютером: это может навредить спине.",最高のパフォーマンスを出したいときは、まず机から離れ、爪の長さを確認するといいかも。: "Если хотите добиться максимума, отойдите от стола и проверьте длину ногтей.",肩と手首の力を抜き、キーを押す力を必要最小限にすると次の入力が軽くなります。: Расслабьте плечи и запястья и нажимайте клавиши только с необходимым усилием — так печатать будет легче.,焦るより、遅くても正確にやるほうがすべてのモードでスコアが伸びます。: "Во всех режимах точность повышает результат, даже если печатать медленнее.",1日に長時間練習しすぎないようにしましょう。腱鞘炎になります。: "Не практикуйтесь слишком долго за день, чтобы избежать перенапряжения сухожилий.",英文はだいぶ日本語文と感覚が違います。分けて練習しましょう。: "Печатать по-английски совсем не так, как по-японски. Тренируйтесь отдельно.",一瞬一瞬のブーストよりも、安定してスラスラ打てるほうがスコアが伸びます。: "Ровный плавный ритм повышает результат лучше, чем редкие всплески скорости.",単語で反射神経を競わず、長文で実力を磨くのがオススメ。: "Развивайте навык на длинных текстах, а не гоняясь за скоростью на отдельных словах.",文字をうったら、すぐにホームポジションに戻しましょう。: После каждого символа сразу возвращайте пальцы на основной ряд клавиатуры.,打鍵中、手元を絶対に見てはいけません。絶対です。: Во время печати никогда не смотрите на руки. Никогда.,できるだけ、毎日練習しましょう。それが最短ルートです。: По возможности занимайтесь каждый день. Это самый быстрый путь к успеху.,ずっと練習をするより、実用もするほうが伸びやすくなります。: "Прогресс идёт быстрее, если сочетать тренировки с практической печатью.",ミスしたキー単体よりも、ミスした組み合わせを見つける方が役に立つかも。: "Возможно, полезнее искать сочетания клавиш, на которых вы ошибаетесь, чем сосредоточиваться на одной клавише.",常に先読みを意識してみよう。: Старайтесь постоянно читать наперёд.,高速化とは、文字を速く打つことではなく、迷う時間を減らすこと。: "Печатать быстрее — значит не ускорять движения пальцев, а меньше времени тратить на раздумья.",「ci」や「le」など、早く打てる別ルートも無理のない範囲で試してみよう。: "Пробуйте другие быстрые варианты ввода, например «ci» или «le», если вам так удобно.",入力画面設定: Настройки экрана ввода,画面設定: Настройки экрана,入力画面のプレビュー: Предварительный просмотр экрана ввода,一時停止: Пауза,10.0打鍵/秒プレビュー: "Предпросмотр: 10,0 нажатий/с",5.0打鍵/秒プレビュー: "Предпросмотр: 5,0 нажатий/с",プレビューの課題文: Предпросмотр задания,短文: Короткий текст,長文: Длинный текст,入力画面: Экран ввода,フォント: Шрифты,表示順: Порядок отображения,漢字・ふりがな・ひらがな表示に使うGoogle Fonts: "Google Fonts для кандзи, фуриганы и хираганы",日本語フォント: Японс