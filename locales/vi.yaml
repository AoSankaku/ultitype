  画像を準備できませんでした。もう一度お試しください。: Không thể chuẩn bị ảnh. Vui lòng thử lại.
  共有メニューにリザルト画像を送りました。: Đã gửi ảnh kết quả đến menu chia sẻ.
  共有を完了できませんでした。画像保存をお試しください。: Chia sẻ thất bại. Hãy thử lưu ảnh.
  Share APIが使えないため、画像を保存して投稿文をコピーしました。: API chia sẻ không khả dụng. Ảnh đã được lưu và nội dung bài đăng đã được sao chép.
  "{service}を開きます。画像はPNG保存から添付してください。": Đang mở {service}. Hãy lưu PNG rồi đính kèm vào bài đăng.
  "{service}を開きました。投稿画面にリザルト画像を貼り付けてください。": Đã mở {service}. Hãy dán ảnh kết quả vào bài đăng.
  "{service}を開き、リザルト画像を保存しました。投稿画面で添付してください。": Đã mở {service} và lưu ảnh kết quả. Hãy đính kèm vào bài đăng.
  投稿テンプレートをコピーしました。: Đã sao chép mẫu bài đăng.
  投稿テンプレートをコピーできませんでした。: Không thể sao chép mẫu bài đăng.
  SNS用リザルト画像: Ảnh kết quả cho mạng xã hội
  "{mode}のリザルト画像。ランク{rank}、{score}ポイント": "Ảnh kết quả {mode}: hạng {rank}, {score} điểm"
  文言をコピー: Sao chép văn bản
  各SNSの投稿画面にはテンプレート文を入力済みです。画像は貼り付け、未対応ブラウザでは保存して添付できます。: Mẫu bài đăng đã sẵn sàng trong từng ứng dụng mạng xã hội. Hãy dán ảnh hoặc lưu rồi đính kèm nếu trình duyệt không hỗ trợ chia sẻ ảnh.
  pre-session tip: Mẹo trước phiên
  post-session tip: Mẹo sau phiên
  本番モードは開始後の入力だけを採点します。: Phiên xếp hạng chỉ chấm phần bạn nhập sau khi bắt đầu.
  本番モードは仮レーティング A0 以上で解放されます。: Chế độ xếp hạng mở khóa khi đạt hạng luyện tập A0 trở lên.
  IMEあり本番では行を課題と一致させてから Enter で提出します。: Ở chế độ xếp hạng dùng IME, hãy nhập khớp dòng đề bài rồi nhấn Enter để gửi.
  500点未満は NR、500点以上は G0、以降は90点ごとにランクが上がります。: Dưới 500 điểm là NR. G0 bắt đầu từ 500 và mỗi hạng tiếp theo cần thêm 90 điểm.
  練習モードの仮レーティングは、本番モード解放の条件として使われます。: Hạng luyện tập quyết định khi nào mở chế độ xếp hạng.
  次の課題プレビューは設定画面で表示方式と長さを変更できます。: Đổi kiểu và độ dài xem trước câu tiếp theo trong Cài đặt.
  正確無比とIMEあり本番では、ミスをBackspaceで戻すまで先に進めません。: Trong chế độ Chính xác và chế độ xếp hạng dùng IME, hãy sửa lỗi bằng Backspace trước khi tiếp tục.
  自動リタイアは、設定から有効にできます。: Bạn có thể bật tự động kết thúc trong Cài đặt.
  自分の「つまづきパターン」を理解するのが、成長に不可欠です。: Hiểu kiểu mắc lỗi của bản thân rất quan trọng để tiến bộ.
  たいてい、他人より自分自身と競争するほうが良い結果が出ます。: Cạnh tranh với chính mình thường đem lại kết quả tốt hơn cạnh tranh với người khác.
  楽だからといって「エンジニア座り」をしていると、腰を壊すので気をつけましょう。: Ngồi khom lưng thoải mái có thể làm đau lưng, hãy chú ý tư thế.
  最高のパフォーマンスを出したいときは、まず机から離れ、爪の長さを確認するといいかも。: Muốn đạt hiệu suất tốt nhất, hãy rời bàn nghỉ một chút và kiểm tra độ dài móng tay.
  肩と手首の力を抜き、キーを押す力を必要最小限にすると次の入力が軽くなります。: Thả lỏng vai và cổ tay, chỉ dùng lực vừa đủ khi nhấn phím.
  焦るより、遅くても正確にやるほうがすべてのモードでスコアが伸びます。: Độ chính xác giúp tăng điểm ở mọi chế độ, kể cả khi bạn gõ chậm hơn.
  1日に長時間練習しすぎないようにしましょう。腱鞘炎になります。: Tránh luyện tập quá lâu trong ngày để giảm nguy cơ căng gân.
  英文はだいぶ日本語文と感覚が違います。分けて練習しましょう。: Gõ tiếng Anh và tiếng Nhật có cảm giác khá khác nhau. Hãy luyện riêng từng thứ.
  一瞬一瞬のブーストよりも、安定してスラスラ打てるほうがスコアが伸びます。: Nhịp gõ đều và trôi chảy giúp tăng điểm hơn những lúc tăng tốc đột ngột.
  単語で反射神経を競わず、長文で実力を磨くのがオススメ。: Hãy nâng cao kỹ năng bằng đoạn văn dài thay vì thi tốc độ từng từ.
  文字をうったら、すぐにホームポジションに戻しましょう。: Sau mỗi lần gõ, hãy đưa tay về hàng phím cơ sở.
  打鍵中、手元を絶対に見てはいけません。絶対です。: Hãy nhìn màn hình khi gõ, đừng nhìn tay.
  できるだけ、毎日練習しましょう。それが最短ルートです。: Hãy luyện tập mỗi ngày nếu có thể. Đó là cách tiến bộ nhanh nhất.
  ずっと練習をするより、実用もするほうが伸びやすくなります。: Kết hợp luyện tập với việc gõ thực tế giúp tiến bộ nhanh hơn.
  ミスしたキー単体よりも、ミスした組み合わせを見つける方が役に立つかも。: Tìm tổ hợp phím hay gây lỗi có thể hữu ích hơn chỉ tập trung vào một phím.
  常に先読みを意識してみよう。: Hãy tập đọc trước trong khi gõ.
  高速化とは、文字を速く打つことではなく、迷う時間を減らすこと。: Gõ nhanh không chỉ nhờ ngón tay, mà còn nhờ bớt thời gian do dự.
  「ci」や「le」など、早く打てる別ルートも無理のない範囲で試してみよう。: Nếu thấy thoải mái, hãy thử cách gõ nhanh như “ci” hoặc “le”.
  入力画面設定: Cài đặt màn hình nhập
