  正確率は正しく入力した文字数 ÷ 入力を試みた文字数です。均等モードのみ、打鍵間隔の安定度が補正として加わります。: Độ chính xác bằng số ký tự nhập đúng chia cho số ký tự đã thử. Chỉ chế độ Flow mới dùng độ ổn định nhịp gõ làm hệ số điều chỉnh.
