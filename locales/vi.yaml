  「っ」の子音重複と ltsu / xtsu / ltu / xtu の扱いを選ぶ: Chọn cách xử lý phụ âm kép và các kiểu nhập ltsu / xtsu / ltu / xtu cho っ.
  促音分割を許可: Cho phép nhập tách sokuon
  表示: Cách viết ưu tiên
