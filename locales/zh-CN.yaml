  共有メニューにリザルト画像を送りました。: 已将结果图片发送到分享菜单。
  共有を完了できませんでした。画像保存をお試しください。: 分享失败，请尝试保存图片。
  Share APIが使えないため、画像を保存して投稿文をコピーしました。: 分享 API 不可用，图片已保存，帖子文字已复制。
  "{service}を開きます。画像はPNG保存から添付してください。": 正在打开 {service}。请保存 PNG 并将其附加到帖子。
  "{service}を開きました。投稿画面にリザルト画像を貼り付けてください。": 已打开 {service}。请将结果图片粘贴到帖子中。
  "{service}を開き、リザルト画像を保存しました。投稿画面で添付してください。": 已打开 {service} 并保存结果图片，请将图片附加到帖子。
  投稿テンプレートをコピーしました。: 已复制发帖模板。
  投稿テンプレートをコピーできませんでした。: 无法复制发帖模板。
  SNS用リザルト画像: 社交媒体成绩图片
  "{mode}のリザルト画像。ランク{rank}、{score}ポイント": "{mode}成绩图片：段位 {rank}，{score} 分"
  文言をコピー: 复制文字
  各SNSの投稿画面にはテンプレート文を入力済みです。画像は貼り付け、未対応ブラウザでは保存して添付できます。: 各社交应用的发帖模板已准备好。请粘贴图片；不支持图片分享的浏览器可保存后再附加。
  pre-session tip: 开始前提示
  post-session tip: 结束后提示
  本番モードは開始後の入力だけを採点します。: 评级练习只统计开始后输入的内容。
  本番モードは仮レーティング A0 以上で解放されます。: 练习段位达到 A0 后即可解锁评级模式。
  IMEあり本番では行を課題と一致させてから Enter で提出します。: 使用输入法的评级模式中，请先让输入行与题目一致，再按 Enter 提交。
  500点未満は NR、500点以上は G0、以降は90点ごとにランクが上がります。: 低于 500 分为 NR；G0 从 500 分开始，此后每升一级需要多 90 分。
  練習モードの仮レーティングは、本番モード解放の条件として使われます。: 练习段位决定评级模式的解锁条件。
  次の課題プレビューは設定画面で表示方式と長さを変更できます。: 可在设置中更改下一题预览的样式和长度。
  正確無比とIMEあり本番では、ミスをBackspaceで戻すまで先に進めません。: 在精准练习和使用输入法的评级模式中，须先按 Backspace 改正错误才能继续。
  自動リタイアは、設定から有効にできます。: 可在设置中启用自动结束练习。
  自分の「つまづきパターン」を理解するのが、成長に不可欠です。: 了解自己的常见错误模式是进步的关键。
  たいてい、他人より自分自身と競争するほうが良い結果が出ます。: 与自己较量，往往比与他人竞争更能取得好成绩。
  楽だからといって「エンジニア座り」をしていると、腰を壊すので気をつけましょう。: 贪图舒服而弯腰驼背可能伤到腰背，请注意坐姿。
  最高のパフォーマンスを出したいときは、まず机から離れ、爪の長さを確認するといいかも。: 想发挥最佳状态时，不妨先离开桌边休息一下，也检查指甲长度。
  肩と手首の力を抜き、キーを押す力を必要最小限にすると次の入力が軽くなります。: 放松肩膀和手腕，按键时只用必要的力度。
  焦るより、遅くても正確にやるほうがすべてのモードでスコアが伸びます。: 即使打得慢一些，准确输入也能提高所有模式的分数。
  1日に長時間練習しすぎないようにしましょう。腱鞘炎になります。: 避免一天练习过久，以降低肌腱劳损的风险。
  英文はだいぶ日本語文と感覚が違います。分けて練習しましょう。: 英语和日语的打字手感很不一样，请分开练习。
  一瞬一瞬のブーストよりも、安定してスラスラ打てるほうがスコアが伸びます。: 稳定流畅的节奏比偶尔的快速爆发更能提高分数。
  単語で反射神経を競わず、長文で実力を磨くのがオススメ。: 与其比拼单个词的速度，不如通过长文提升实力。
  文字をうったら、すぐにホームポジションに戻しましょう。: 每次击键后都将手指放回基准键位。
  打鍵中、手元を絶対に見てはいけません。絶対です。: 打字时看着屏幕，绝对不要偷看手。
  できるだけ、毎日練習しましょう。それが最短ルートです。: 尽可能每天练习，这是进步最快的方法。
  ずっと練習をするより、実用もするほうが伸びやすくなります。: 将练习与实际打字结合，更容易进步。
  ミスしたキー単体よりも、ミスした組み合わせを見つける方が役に立つかも。: 找出容易出错的按键组合，可能比只关注单个按键更有帮助。
  常に先読みを意識してみよう。: 打字时试着提前阅读后面的内容。
  高速化とは、文字を速く打つことではなく、迷う時間を減らすこと。: 打得快不只是手指快，更重要的是减少犹豫。
  「ci」や「le」など、早く打てる別ルートも無理のない範囲で試してみよう。: 觉得顺手时，可试试 “ci” 或 “le” 等更快的输入方式。
