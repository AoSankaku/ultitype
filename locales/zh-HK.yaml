  画像を準備できませんでした。もう一度お試しください。: 無法準備圖片，請再試一次。
  共有メニューにリザルト画像を送りました。: 已將成績圖片傳送到分享選單。
  共有を完了できませんでした。画像保存をお試しください。: 分享失敗，請嘗試儲存圖片。
  Share APIが使えないため、画像を保存して投稿文をコピーしました。: 分享 API 無法使用，圖片已儲存，帖文文字已複製。
  "{service}を開きます。画像はPNG保存から添付してください。": 正在開啟 {service}。請儲存 PNG 並附加至帖文。
  "{service}を開きました。投稿画面にリザルト画像を貼り付けてください。": 已開啟 {service}。請將成績圖片貼到帖文中。
  "{service}を開き、リザルト画像を保存しました。投稿画面で添付してください。": 已開啟 {service} 並儲存成績圖片，請將圖片附加至帖文。
