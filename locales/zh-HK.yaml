  文言をコピー: 複製文字
  各SNSの投稿画面にはテンプレート文を入力済みです。画像は貼り付け、未対応ブラウザでは保存して添付できます。: 各社交應用程式的帖文範本已準備好。請貼上圖片；不支援圖片分享的瀏覽器可先儲存再附加。
  pre-session tip: Skrin petua sebelum sesi
  post-session tip: Skrin petua selepas sesi
  本番モードは開始後の入力だけを採点します。: Sesi penarafan hanya mengira input selepas dimulakan.
  本番モードは仮レーティング A0 以上で解放されます。: Mod penarafan dibuka pada tahap latihan A0 atau lebih tinggi.
  IMEあり本番では行を課題と一致させてから Enter で提出します。: Dalam mod penarafan ber-IME, padankan baris soalan dan tekan Enter untuk menghantar.
  500点未満は NR、500点以上は G0、以降は90点ごとにランクが上がります。: Skor bawah 500 ialah NR. G0 bermula pada 500 dan setiap tahap seterusnya memerlukan 90 mata lagi.
  練習モードの仮レーティングは、本番モード解放の条件として使われます。: 練習段位決定評級模式的解鎖條件。
  次の課題プレビューは設定画面で表示方式と長さを変更できます。: 可在設定中更改下一題預覽的樣式與長度。
  正確無比とIMEあり本番では、ミスをBackspaceで戻すまで先に進めません。: Dalam latihan ketepatan dan mod penarafan IME, betulkan kesilapan dengan Backspace sebelum meneruskan.
  自動リタイアは、設定から有効にできます。: 可在設定中啟用自動結束練習。
  自分の「つまづきパターン」を理解するのが、成長に不可欠です。: 了解自己的常見錯誤模式是進步的關鍵。
  たいてい、他人より自分自身と競争するほうが良い結果が出ます。: Biasanya anda mendapat hasil lebih baik dengan bersaing dengan diri sendiri.
  楽だからといって「エンジニア座り」をしていると、腰を壊すので気をつけましょう。: Duduk membongkok boleh menegangkan belakang; jaga postur anda.
  最高のパフォーマンスを出したいときは、まず机から離れ、爪の長さを確認するといいかも。: Untuk prestasi terbaik, berehat dari meja dan periksa panjang kuku.
  肩と手首の力を抜き、キーを押す力を必要最小限にすると次の入力が軽くなります。: Rehatkan bahu dan pergelangan tangan; tekan kekunci dengan daya secukupnya.
  焦るより、遅くても正確にやるほうがすべてのモードでスコアが伸びます。: Ketepatan meningkatkan skor dalam setiap mod walaupun anda menaip lebih perlahan.
  1日に長時間練習しすぎないようにしましょう。腱鞘炎になります。: Elakkan berlatih terlalu lama sehari untuk mengurangkan risiko ketegangan tendon.
  英文はだいぶ日本語文と感覚が違います。分けて練習しましょう。: Perasaan menaip bahasa Inggeris dan Jepun sangat berbeza. Berlatihlah secara berasingan.
  一瞬一瞬のブーストよりも、安定してスラスラ打てるほうがスコアが伸びます。: Rentak stabil dan lancar meningkatkan skor lebih baik daripada pecutan seketika.
  単語で反射神経を競わず、長文で実力を磨くのがオススメ。: Tingkatkan kemahiran melalui petikan panjang, bukan perlumbaan kata tunggal.
  文字をうったら、すぐにホームポジションに戻しましょう。: Kembali ke baris asas selepas setiap ketukan.
  打鍵中、手元を絶対に見てはいけません。絶対です。: Lihat skrin semasa menaip. Jangan intai tangan.
  できるだけ、毎日練習しましょう。それが最短ルートです。: Berlatih setiap hari jika boleh; itulah cara terpantas untuk maju.
  ずっと練習をするより、実用もするほうが伸びやすくなります。: Gabungkan latihan dengan menaip harian untuk maju lebih cepat.
  ミスしたキー単体よりも、ミスした組み合わせを見つける方が役に立つかも。: Mencari gabungan kekunci yang menyebabkan kesilapan mungkin lebih berguna daripada satu kekunci.
  常に先読みを意識してみよう。: Cuba baca ke hadapan semasa menaip.
  高速化とは、文字を速く打つことではなく、迷う時間を減らすこと。: Kelajuan menaip lebih bergantung pada kurang teragak-agak daripada gerakan jari.
  「ci」や「le」など、早く打てる別ルートも無理のない範囲で試してみよう。: 覺得順手時，可試試「ci」或「le」等較快的輸入方式。
